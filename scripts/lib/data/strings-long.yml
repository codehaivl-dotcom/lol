lore.title: "Tinh Thạch Ký Ức"
lore.p1: "Khoảng một triệu năm trước năm 2300, nền văn minh Cổ Linh phát triển rực rỡ trên vùng đất nay là Việt Nam. Đại Tịch cắt đứt chuỗi lịch sử; dấu tích và ký ức về các liên minh gần như biến mất."
lore.p2: "Năm 2300, người Việt Nam khai thác được Tinh Thạch Ký Ức và dùng Hồi Tưởng Đồng Bộ để hóa thân vào các Cổ Linh, tái hiện những trận chiến được lưu trong tinh thạch. Đây là mô phỏng ký ức, không phải du hành thời gian."
lore.p3: "Minh Ước đối đầu Triều Vực trên Cửu Mạch Chiến Trường. Đội nào phá được Tâm Mạch của đối phương sẽ viết lại ký ức ấy."
hero.moc_lam.bio: "Mộc Lẫm từng dựng cổng chắn cuối cùng cho Minh Ước, nhưng luôn để một lối mở cho người sơ tán. Khi ký ức chiến trường vỡ vụn, anh vẫn nhớ tiếng gọi từ phía bên kia cánh cổng."
hero.kha_tan.bio: "Kha Tàn ghi lại mọi món nợ chiến thuật lên chuỗi vảy của mình. Hắn theo Triều Vực vì tin một thế giới chỉ tồn tại bằng cách vay mượn năng lượng sẽ sớm sụp đổ."
hero.mi_dang.bio: "Mị Đăng quản kho ký ức của những người đã mất. Cô gia nhập chiến trường để lần theo một giọng nói không có trong bất kỳ bản lưu nào."
hero.hoa_tuy.bio: "Hỏa Tủy vận hành một lò nhiệt sâu dưới nền Cửu Mạch. Khi lò bắt đầu phát ra ký ức thay vì năng lượng, anh rời vị trí canh giữ để tìm nguyên nhân."
hero.nham_vu.bio: "Nham Vũ mở tuyến bay qua vùng nhiễu ký ức. Con chim của cô lưu tọa độ cuối cùng của những nơi mà bản đồ Cổ Linh không còn nhận ra."
hero.van_dao.bio: "Vân Dao từng điều hòa bão plasma quanh các thềm bay. Cô chọn chữa lành thay vì khóa bầu khí quyển khi hai liên minh làm tầng trời rạn nứt."
hero.hao_nhat.bio: "Hạo Nhật là người giữ các gương quỹ đạo của Minh Ước. Anh từng dùng khiên của mình che lối rút khỏi một thành phố đang mất trọng lực."
hero.huong_mai.bio: "Hương Mai là bác sĩ trường lực của Minh Ước. Cô dùng ánh sáng để nối lại các lớp ký ức bị tổn thương và để lại thông điệp cuối trong một Tinh Thạch."
hero.moc_lam.passive.desc: "Mỗi đòn đánh thứ ba nện như đá đổ: thêm sát thương vật lý và làm chậm mục tiêu 30% trong 1 giây."
hero.moc_lam.q.desc: "Lao thẳng 7,5 m theo hướng ngắm, gây sát thương vật lý và ghim chặt tướng đầu tiên trúng phải."
hero.moc_lam.rmb.desc: "Gồng vai như núi, dựng khiên cho bản thân theo máu tối đa trong 3 giây."
hero.moc_lam.e.desc: "Quét kiếm một vòng quanh thân, chém mọi kẻ địch gần bên. Vẫn đi được trong lúc quét."
hero.moc_lam.r.desc: "Nhảy tới một kẻ địch, cắm kiếm xuống mạch đất: sát thương tăng theo máu đã mất của mục tiêu, rồi dựng khiên cho cả đồng đội quanh đó."
hero.kha_tan.passive.desc: "Đòn đánh và chiêu ghi một tầng nợ máu lên mục tiêu, chảy máu mỗi giây, cộng dồn tới 5 tầng trong 4 giây."
hero.kha_tan.q.desc: "Vung liềm rìu quét nửa vòng phía trước. Hồi máu bằng 30% sát thương gây ra và thêm một tầng nợ."
hero.kha_tan.rmb.desc: "Lướt tới mục tiêu, chém đứt gân: sát thương và làm chậm 40% trong 1,5 giây."
hero.kha_tan.e.desc: "Ném móc xích theo hướng ngắm, kéo kẻ địch đầu tiên trúng về phía mình 5 m."
hero.kha_tan.r.desc: "Đòi nợ cuối: sát thương chuẩn tăng theo mỗi tầng nợ trên mục tiêu. Hạ gục thì chiêu hồi lại ngay."
hero.mi_dang.passive.desc: "Sau mỗi lần dùng chiêu, đòn đánh kế tiếp mang theo đốm bóng, thêm sát thương phép tăng theo cấp."
hero.mi_dang.q.desc: "Thả chiếc đèn bay ra rồi quay về. Kẻ địch có thể trúng hai lần, lượt đi và lượt về."
hero.mi_dang.rmb.desc: "Lướt như trăng rẽ mây tới mục tiêu, chém một nhát sát thương phép."
hero.mi_dang.e.desc: "Phóng lời vẫy gọi: kẻ địch đầu tiên trúng bị mê hoặc 1,1 giây và bước về phía Mị Đăng."
hero.mi_dang.r.desc: "Ba bước mờ liên tiếp xuyên qua kẻ địch, mỗi bước chém một lần và không thể bị chọn làm mục tiêu."
hero.hoa_tuy.passive.desc: "Chiêu trúng đích đốt mục tiêu 3% máu tối đa trong 3 giây và giảm 40% hồi máu nhận được."
hero.hoa_tuy.q.desc: "Gọi một cột lửa trồi lên tại điểm chọn sau 0,7 giây, gây sát thương và làm choáng 0,75 giây."
hero.hoa_tuy.rmb.desc: "Bắn viên than đánh dấu kẻ địch. Đòn sát thương kế tiếp lên mục tiêu kích nổ dấu, gây thêm sát thương phép."
hero.hoa_tuy.e.desc: "Thổi luồng khí nóng quanh thân: sát thương, đẩy lùi 3 m và làm chậm 25%."
hero.hoa_tuy.r.desc: "Gọi thiên thạch than rơi xuống điểm xa tới 18 m sau 1 giây, nổ tung cả vùng."
hero.nham_vu.passive.desc: "Mỗi mũi tên thứ tư là mũi sỏi nặng, làm chậm mục tiêu 20% trong 1 giây."
hero.nham_vu.q.desc: "Bắn ba mũi tên xoè hình quạt phía trước."
hero.nham_vu.rmb.desc: "Kéo căng dây hổ phách, bắn phát nạp bay xa 16 m, gây sát thương lớn và làm chậm 40%."
hero.nham_vu.e.desc: "Thả chim mở lối, nhảy lùi 4 m, gỡ mọi làm chậm và trói, tăng tốc chạy và tốc đánh trong 3,5 giây."
hero.nham_vu.r.desc: "Lùi khỏi vách 6 m rồi phóng mũi lao xuyên thẳng 18 m, trúng mọi kẻ địch trên đường."
hero.van_dao.passive.desc: "Sau mỗi lần dùng chiêu, đòn đánh kế tiếp rẽ tia sét, thêm sát thương phép tăng theo cấp."
hero.van_dao.q.desc: "Tụ mây giông tại điểm chọn: sát thương kẻ địch trong vùng, hồi máu cho bản thân và đồng minh."
hero.van_dao.rmb.desc: "Phóng ấn gió theo hướng ngắm, trói kẻ địch đầu tiên trúng trong 1,5 giây."
hero.van_dao.e.desc: "Khoác áo bão: khiên cho bản thân, tăng 20% tốc chạy, gió cuốn sạch chảy máu và đẩy lùi kẻ địch sát bên."
hero.van_dao.r.desc: "Sóng gió lớn toả quanh thân, đẩy lùi kẻ địch 6 m và hồi máu cho mọi đồng minh trong vùng."
hero.hao_nhat.passive.desc: "Sau mỗi lần dựng khiên, đòn đánh kế tiếp đốt nắng: thêm sát thương phép và làm chậm."
hero.hao_nhat.q.desc: "Xông khiên theo hướng ngắm, choáng tướng địch đầu tiên chặn đường."
hero.hao_nhat.rmb.desc: "Dựng khiên cho bản thân; khi vỡ hoặc hết hạn, nắng nổ quanh thân gây sát thương phép."
hero.hao_nhat.e.desc: "Phóng dây sáng xuyên lính, dừng ở tướng địch đầu tiên và làm chậm."
hero.hao_nhat.r.desc: "Hai cột nắng giáng xuống một vùng, cách nhau 0,6 giây; nhịp hai choáng."
hero.huong_mai.passive.desc: "Mỗi đòn đánh trúng rút ngắn hồi chiêu Q, chuột phải và E."
hero.huong_mai.q.desc: "Tia sáng gây sát thương kẻ địch đầu tiên trúng và chữa đồng minh yếu nhất trong tầm."
hero.huong_mai.rmb.desc: "Ném vòng hương bay ra rồi quay về, trúng hai lượt và làm chậm."
hero.huong_mai.e.desc: "Dựng tường ánh sáng chặn lối: kẻ địch chạm vào bị làm chậm nặng."
hero.huong_mai.r.desc: "Vùng sáng báo trước 1 giây rồi nổ: sát thương kẻ địch, chữa bản thân và đồng minh trong vùng."
tip.moc_lam.passive: "Gây thêm {bonus} (+{bonusAd}% công vật lý) sát thương vật lý ở mỗi đòn đánh thứ {n} và làm chậm mục tiêu {slow}% trong {slowDur} giây."
tip.moc_lam.lmb: "Chém một mục tiêu trong {range} m, gây sát thương vật lý bằng 100% công vật lý."
tip.moc_lam.q: "Lao {dash} m theo hướng ngắm, gây {dmg} (+{bad}% công vật lý cộng thêm) sát thương vật lý lên kẻ địch đầu tiên trúng và trói nó {root} giây."
tip.moc_lam.rmb: "Dựng khiên {shield} (+{shHp}% máu tối đa) cho bản thân trong {shDur} giây."
tip.moc_lam.e: "Quét kiếm một vòng bán kính {radius} m quanh thân, gây {dmg} (+{ad}% công vật lý) sát thương vật lý lên mọi kẻ địch trúng."
tip.moc_lam.r: "Nhảy tới kẻ địch trong {range} m, gây {dmg} (+{bad}% công vật lý cộng thêm, +{miss}% máu đã mất của mục tiêu) sát thương vật lý. Dựng khiên {shield} cho bản thân và đồng minh trong {allyR} m trong {shDur} giây."
tip.kha_tan.passive: "Gắn một tầng chảy máu bằng đòn đánh, Liềm Rìu và Chém Gân: mỗi tầng gây {bleed} (+{bleedBad}% công vật lý cộng thêm) sát thương vật lý mỗi giây trong {dur} giây, cộng dồn tối đa {stacks} tầng."
tip.kha_tan.lmb: "Chém một mục tiêu trong {range} m, gây sát thương vật lý bằng 100% công vật lý."
tip.kha_tan.q: "Vung liềm rìu quét nửa vòng {arc}° phía trước, sau {delay} giây gây {dmg} (+{ad}% công vật lý) sát thương vật lý trong bán kính {radius} m; phía sau không trúng. Hồi máu bằng {share}% sát thương gây ra và gắn 1 tầng chảy máu."
tip.kha_tan.rmb: "Lướt tới mục tiêu trong {range} m, gây {dmg} (+{ad}% công vật lý) sát thương vật lý, làm chậm {slow}% trong {slowDur} giây và gắn 1 tầng chảy máu."
tip.kha_tan.e: "Phóng móc xích {range} m theo hướng ngắm, gây {dmg} (+{bad}% công vật lý cộng thêm) sát thương vật lý và kéo kẻ địch đầu tiên trúng về phía mình tối đa {pull} m."
tip.kha_tan.r: "Chém kẻ địch trong {range} m, gây {dmg} (+{bad}% công vật lý cộng thêm) sát thương chuẩn, tăng {stk}% với mỗi tầng chảy máu trên mục tiêu. Hạ gục tướng thì hồi chiêu được làm mới."
tip.mi_dang.passive: "Cường hoá đòn đánh kế tiếp sau mỗi lần dùng chiêu: gây thêm {bonus} (+{bonusAp}% công phép, +{perLv} mỗi cấp) sát thương phép."
tip.mi_dang.lmb: "Bắn đốm sáng tới mục tiêu trong {range} m, gây sát thương phép bằng 100% công vật lý (+{ap}% công phép)."
tip.mi_dang.q: "Thả đèn bay {range} m rồi quay về, gây {dmg} (+{ap}% công phép) sát thương phép mỗi lần trúng; một kẻ địch có thể trúng {hits} lần."
tip.mi_dang.rmb: "Lướt tới mục tiêu trong {range} m, chém {dmg} (+{ap}% công phép) sát thương phép."
tip.mi_dang.e: "Phóng lời vẫy gọi {range} m theo hướng ngắm, gây {dmg} (+{ap}% công phép) sát thương phép và mê hoặc kẻ địch đầu tiên trúng {charm} giây."
tip.mi_dang.r: "Lướt tới mục tiêu trong {range} m và chém {hits} lần, mỗi lần {dmg} (+{ap}% công phép) sát thương phép. Không thể bị chọn làm mục tiêu trong {untarget} giây."
tip.hoa_tuy.passive: "Đốt kẻ địch trúng chiêu, gây sát thương phép bằng {burn}% máu tối đa của nó trong {dur} giây và giảm {anti}% hồi máu nhận được."
tip.hoa_tuy.lmb: "Ném than tới mục tiêu trong {range} m, gây sát thương phép bằng 100% công vật lý (+{ap}% công phép)."
tip.hoa_tuy.q: "Gọi cột lửa tại điểm chọn trong {range} m: sau {delay} giây gây {dmg} (+{ap}% công phép) sát thương phép trong bán kính {radius} m và làm choáng {stun} giây."
tip.hoa_tuy.rmb: "Bắn viên than {range} m, gây {dmg} (+{ap}% công phép) sát thương phép và đánh dấu kẻ địch đầu tiên trúng {markDur} giây. Đòn kế tiếp của bạn lên nó kích nổ dấu, gây thêm {mark} (+{markAp}% công phép) sát thương."
tip.hoa_tuy.e: "Thổi khí nóng bán kính {radius} m quanh thân, gây {dmg} (+{ap}% công phép) sát thương phép, đẩy lùi {knock} m và làm chậm {slow}% trong {slowDur} giây."
tip.hoa_tuy.r: "Gọi thiên thạch xuống điểm chọn trong {range} m: sau {delay} giây nổ bán kính {radius} m, gây {dmg} (+{ap}% công phép) sát thương phép."
tip.nham_vu.passive: "Làm chậm mục tiêu {slow}% trong {slowDur} giây bằng mỗi mũi tên thứ {n}."
tip.nham_vu.lmb: "Bắn tên sỏi tới mục tiêu trong {range} m, gây sát thương vật lý bằng 100% công vật lý."
tip.nham_vu.q: "Bắn {count} mũi tên xoè {spread}°, bay {range} m, mỗi mũi xuyên mọi kẻ địch nó chạm, gây {dmg} (+{ad}% công vật lý) sát thương vật lý. Khe giữa các mũi không gây sát thương; trúng nhiều mũi chỉ tính một lần."
tip.nham_vu.rmb: "Nạp {windup} giây rồi bắn phát tên {range} m, gây {dmg} (+{ad}% công vật lý) sát thương vật lý và làm chậm kẻ địch đầu tiên trúng {slow}% trong {slowDur} giây."
tip.nham_vu.e: "Nhảy lùi {dash} m, gỡ làm chậm và trói, tăng {ms}% tốc chạy và {as}% tốc đánh trong {buffDur} giây."
tip.nham_vu.r: "Lùi {dash} m rồi phóng mũi lao xuyên {range} m, gây {dmg} (+{bad}% công vật lý cộng thêm) sát thương vật lý lên mọi kẻ địch trên đường."
tip.van_dao.passive: "Cường hoá đòn đánh kế tiếp sau mỗi lần dùng chiêu: rẽ tia sét gây thêm {bonus} (+{bonusAp}% công phép, +{perLv} mỗi cấp) sát thương phép."
tip.van_dao.lmb: "Phóng tia rẽ tới mục tiêu trong {range} m, gây sát thương phép bằng 100% công vật lý (+{ap}% công phép)."
tip.van_dao.q: "Tụ mây tại điểm chọn trong {range} m: sau {delay} giây gây {dmg} (+{ap}% công phép) sát thương phép lên kẻ địch và hồi {heal} (+{healAp}% công phép) máu cho bạn và đồng minh trong bán kính {radius} m."
tip.van_dao.rmb: "Phóng ấn gió {range} m theo hướng ngắm, gây {dmg} (+{ap}% công phép) sát thương phép và trói kẻ địch đầu tiên trúng {root} giây."
tip.van_dao.e: "Dựng khiên {shield} (+{shAp}% công phép) cho bản thân trong {shDur} giây, tăng {ms}% tốc chạy trong {buffDur} giây và gỡ làm chậm, trói, chảy máu. Đẩy kẻ địch trong {pushR} m lùi {knock} m và làm chậm {pushSlow}% trong {pushSlowDur} giây. Khi khiên còn, thân bạn chắn đạn địch bắn vào đồng minh đứng phía sau."
tip.van_dao.r: "Thổi sóng gió bán kính {radius} m quanh thân, gây {dmg} (+{ap}% công phép) sát thương phép, đẩy lùi kẻ địch {knock} m và hồi {heal} (+{healAp}% công phép) máu cho bạn và đồng minh trong vùng."
tip.hao_nhat.passive: "Sau mỗi lần dựng khiên, đòn đánh kế tiếp đốt nắng gây thêm {bonus} (+{bonusAp}% công phép, +{perLv} mỗi cấp) sát thương phép và làm chậm {slow}% trong {slowDur} giây."
tip.hao_nhat.lmb: "Chém lưỡi kiếm tới mục tiêu trong {range} m, gây sát thương vật lý bằng 100% công vật lý."
tip.hao_nhat.q: "Xông khiên {dash} m theo hướng ngắm. Tướng địch đầu tiên chặn đường nhận {dmg} (+{ap}% công phép) sát thương phép và bị choáng {stun} giây."
tip.hao_nhat.rmb: "Dựng khiên {shield} (+{shHp}% máu tối đa) trong {shDur} giây. Khi khiên vỡ hoặc hết hạn, nắng nổ bán kính {burstR} m gây {burst} (+{burstAp}% công phép) sát thương phép."
tip.hao_nhat.e: "Phóng dây sáng {range} m theo hướng ngắm, xuyên qua lính và dừng ở tướng địch đầu tiên: gây {dmg} (+{ap}% công phép) sát thương phép và làm chậm {slow}% trong {slowDur} giây."
tip.hao_nhat.r: "Gọi hai cột nắng xuống vùng bán kính {radius} m trong {range} m. Nhịp đầu giáng sau {delay} giây, nhịp hai sau thêm {gap} giây; mỗi nhịp gây {dmg} (+{ap}% công phép) sát thương phép, nhịp hai choáng {stun} giây."
tip.huong_mai.passive: "Mỗi đòn đánh trúng rút ngắn {sec} giây hồi chiêu của Q, chuột phải và E. Không rút ngắn chiêu cuối."
tip.huong_mai.lmb: "Bắn tia sớm tới mục tiêu trong {range} m, gây sát thương phép bằng 100% công vật lý (+{ap}% công phép)."
tip.huong_mai.q: "Phóng tia sáng {range} m theo hướng ngắm: kẻ địch đầu tiên trúng nhận {dmg} (+{ap}% công phép) sát thương phép; đồng minh yếu máu nhất trong tầm được hồi {heal} (+{healAp}% công phép) máu."
tip.huong_mai.rmb: "Ném vòng hương {range} m theo hướng ngắm rồi quay về. Mỗi lượt trúng gây {dmg} (+{ap}% công phép) sát thương phép và làm chậm {slow}% trong {slowDur} giây."
tip.huong_mai.e: "Dựng tường ánh sáng tại điểm chọn trong {range} m, rộng {radius} m: sau {delay} giây gây {dmg} (+{ap}% công phép) sát thương phép và làm chậm {slow}% trong {slowDur} giây."
tip.huong_mai.r: "Đánh dấu vùng bán kính {radius} m trong {range} m. Sau {delay} giây ánh đầu ngày nổ: gây {dmg} (+{ap}% công phép) sát thương phép lên kẻ địch và hồi {heal} (+{healAp}% công phép) máu cho bạn và đồng minh trong vùng."
tip.meta.cd: "Hồi chiêu {cd} giây"
tip.meta.cost: "{cost} năng lượng"
tip.meta.free: "Không tốn năng lượng"
hero.bach_dien.bio: "Bách Diện là vũ công gương đồng của các điện múa cổ. Cô vừa đánh vừa múa: mỗi chiêu là một bước, mỗi tấm gương là một nhịp."
hero.bach_dien.passive.desc: "Chiêu trúng đích: đòn đánh kế tiếp cộng sát thương phép và cô lướt nhanh hơn 20% trong 1,5 giây."
hero.bach_dien.q.desc: "Xoay trọn vòng rồi ném gương ngang, lướt qua lính, dừng ở tướng địch đầu tiên và làm chậm."
hero.bach_dien.rmb.desc: "Bước jeté lướt tới theo hướng ngắm, gây sát thương phép kẻ địch trên đường."
hero.bach_dien.e.desc: "Xoay lướt 3,5 m, không thể bị chọn 0,5 giây, rồi tăng tốc 30% trong 2 giây."
hero.bach_dien.r.desc: "Múa giữa vòng gương 4,5 m: ba nhịp sát thương phép cách nhau 0,6 giây; nhịp thứ ba choáng."
hero.ngu_dang.bio: "Ngư Đăng là gấu ngựa ngực trăng gác đèo. Tiếng chuông đồng của nó gọi đoàn người về; giữa trận, nó gọi đồng đội về bên mình."
hero.ngu_dang.passive.desc: "Mỗi Roi Chuông trúng rút 0,8 giây hồi chiêu thường; mỗi chiêu tối đa một lần mỗi lượt hồi, cách nhau ít nhất 0,5 giây."
hero.ngu_dang.q.desc: "Ngắm 0,5 giây theo đường xích dày rồi ném quả chuông đồng trên xích: kẻ địch đầu tiên trúng chịu sát thương phép, bị kéo về tối đa 6 m và choáng 0,5 giây."
hero.ngu_dang.rmb.desc: "Cắm chuông xuống đất dưới chân: bản thân và đồng minh trong vòng 6 m nhận khiên 3 giây."
hero.ngu_dang.e.desc: "Quét vòng xích chuông 3,5 m tại điểm cách tối đa 6 m: sát thương phép và làm chậm 40% trong 1,5 giây."
hero.ngu_dang.r.desc: "Ba vòng chuông đồng ảo hạ quanh mình thành lồng 5 m: kẻ địch trong lồng chịu sát thương phép và bị trói 1,5 giây trong tiếng ngân dội."
hero.mac_lien.bio: "Mặc Liên là Cổ Linh của lớp sơn phủ ký ức qua các địa tầng. Thân sơn son, sơn then bóng cứng, khảm vỏ trứng; mỗi nhát cọ của cô sơn lại trận đánh."
hero.mac_lien.passive.desc: "Sau mỗi chiêu, đòn đánh kế tiếp vẩy son, cộng sát thương phép."
hero.mac_lien.q.desc: "Vẩy ba nét sơn son xoè quạt 30°, mỗi nét bay thẳng và gây sát thương phép; đứng gần có thể trúng cả ba nét."
hero.mac_lien.rmb.desc: "Ném quả sơn son xuyên qua kẻ địch, nở to dần khi bay; gây sát thương phép và làm chậm 30% trong 1,5 giây."
hero.mac_lien.e.desc: "Lách 4,5 m về phía mục tiêu, nổ sơn nơi đáp gây sát thương phép."
hero.mac_lien.r.desc: "Nhúng cọ rồi vẽ một vòng sơn son 5,5 m; nét khép lại gây sát thương phép lớn và hất văng kẻ địch trong vòng."
hero.cot_ben.bio: "Cốt Bện là bùn ruộng cũ tự đứng dậy sau mùa lũ, rơm bện làm gân, mạ non mọc trên lưng. Hắn lội thẳng vào hàng địch, kéo kẻ đứng xa về và vùi chúng trong bụng bùn."
hero.cot_ben.passive.desc: "Chiêu trúng tướng trát bùn chua: đốt 2% máu tối đa của mục tiêu trong 3 giây và giảm hồi máu 30%."
hero.cot_ben.q.desc: "Ném cái bừa tre bay thẳng 12 m; lính chặn được. Tướng đầu tiên trúng chịu sát thương vật lý và bị kéo về sát bên."
hero.cot_ben.rmb.desc: "Phun nón bùn 100° bán kính 3,5 m phía trước: sát thương phép và làm chậm 50% trong 1,5 giây."
hero.cot_ben.e.desc: "Vục hai tay xuống bùn hất một kẻ địch trong 2,5 m: sát thương vật lý cộng 8% máu đã mất, hồi máu bằng nửa sát thương."
hero.cot_ben.r.desc: "Lao tới một tướng trong 3 m và vùi nó vào bụng bùn: cả hai không thể bị chọn 1,75 giây, nạn nhân bất động, rồi bị nhả ra kèm sát thương phép."
