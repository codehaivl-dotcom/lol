# Per-hero, per-slot SFX (doc 34 · SFX_PROPOSED, chưa INTEGRATED). Chỉ SFX, không VO.
# Mỗi tướng một "giọng chất liệu":
#   moc_lam  đồng thau + khiên đá, nước bờ sông (đoản đao bản rộng, khiên lõi lam)
#   kha_tan  sắt nặng + xích tinh thể (trường qua lưỡi móc, chảy máu)
#   mi_dang  đèn kính + lửa ma tím, thì thầm (đèn tím, đoản nhận, ảnh mờ)
#   hoa_tuy  than/dung nham, thiên thạch (lư hương thiên thạch, mảnh than bay)
#   nham_vu  dây cung + mũi tên sỏi/hổ phách, chim tinh thể (cung composite)
#   hao_nhat thép trắng + khiên vàng, ánh bình minh (kiếm một tay, khiên tròn lõi quang)
#   van_dao  gió/mây/sét (trượng chim rỗng, giông)
# Khoá: lmb q rmb e r = cast/swing của slot; passive = proc nội tại; hit = đòn trúng; death = gục.
# Đường dẫn được CDN sinh lần đầu được gọi; tên đã phục vụ là bất biến (đổi âm = tên mới -v2).
