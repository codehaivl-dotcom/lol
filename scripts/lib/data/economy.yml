# Vàng, XP, hồi sinh, vật phẩm slice (doc 08 §2, §4, §8). Bản nháp, cân bằng bằng mô phỏng.
startGold: 500
passiveGold: 3          # g/s khi sống
xpTable: [280, 380, 480, 580, 700, 820, 940, 1080, 1220, 1380, 1540, 1720, 1900, 2100]
maxLevel: 15
# levelUpHeal bỏ 2026-10-09 (@lukasai: lên cấp không hồi máu; chỉ về nhà, đồng đội heal, uống máu)
respawn: 12
heroKill: { gold: 300, xp: 300 }
fountainRadius: 13
fountainHeal: 0.12      # phần max HP/s
shopRadius: 24
recall: 8
dodge: { stamina: 25, maxStamina: 100, staminaRegen: 18, cooldown: 15, iframe: 0.42, speed: 16.5, duration: 0.3 }
maxItems: 6
sellRatio: 0.6         # bán lại: phần giá mua trả lại (hero.js sell, đã có từ trước)
# ---- kinh tế trận theo MAP (lib/econ.js; @lukasai 09/10 P0 ECONOMY PACING). Tướng stamp profile lúc vào trận (state.ecoP).
# startGold/passiveGold/heroKill ở trên = profile 'base' (số cũ, giữ để so sánh/rollback). 1v1 và 5v5 KHÔNG dùng chung khi chưa đo.
# Chọn bằng tools/balance/economy.mjs (PASS_MODEL), chưa có PASS_ENGINE.
economyProfiles:
  base:            { version: base-2026-10-08, mode: "mọi map (cũ)", startGold: 500, passiveGold: 3, minionGoldMult: 1, heroKillGold: 300, towerGold: 150 }
  mach_giua-1v1:   { version: mg1v1-0.1, mode: "Mạch Giữa 1v1", startGold: 300, passiveGold: 1, minionGoldMult: 0.7, heroKillGold: 150, towerGold: 150 }
economyByMap:
  mach_giua: mach_giua-1v1     # map 5v5 sau này: profile riêng, đo lại (thu nhập support chưa thiết kế)
  default: base
