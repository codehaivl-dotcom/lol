# Thông báo hạ gục (Slain): một bảng cho mọi map. Đọc bởi scripts/lib/killcall.js (ghi) và scripts/screens/match/widgets/slain.js (vẽ).
# LoL/AoV: multi-kill trong 10 s giữa hai lần hạ; chuỗi 3/5/7; chặn đứng khi nạn nhân đang chuỗi >= 3. Chiến công đầu: lần hạ tướng đầu tiên của trận.
multiWindow: 10      # giây giữa hai lần hạ để tính song/tam/tứ/ngũ sát
shutdownStreak: 3    # nạn nhân đang chuỗi từ mức này thì lần hạ là 'chặn đứng'
spree: { 3: spree, 5: unstoppable, 7: legendary }   # chuỗi đúng mức này (7: từ 7 trở lên) xướng danh hiệu
bannerSeconds: 3.2   # banner giữa trên màn hình
