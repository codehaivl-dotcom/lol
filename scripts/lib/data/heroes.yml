# Cổ Linh Thần Chiến: kit tướng. Canonical gameplay data (docs 08, 09).
# Đơn vị: mét, giây, m/s, đòn/s, hồi mỗi giây. Damage dùng công thức 08 §1.1 (100 / (100 + kháng)).
# Rank (D1): q/rmb/e mảng 5 phần tử (cấp 1/3/5/7/9); r mảng 3 phần tử (cấp 6/11/15).
# ad = hệ số trên tổng AD; bonusAd = hệ số trên AD từ vật phẩm; ap = hệ số trên AP; maxHp = phần max HP của người dùng.
# aim: melee | projectile (đánh thường bắn) | skillshot {width, speed} | area {radius, delay} | self | target (chọn mục tiêu, luôn trúng trong tầm)
# Mọi số đi qua tools/balance (mô phỏng) và docs/co-linh-than-chien/balance-log.md. Đổi số = một dòng log.
version: 1
slice: [moc_lam, kha_tan, mi_dang, hoa_tuy, nham_vu, van_dao, hao_nhat, huong_mai, bach_dien, cot_ben, mac_lien, ngu_dang]

