hero.moc_lam.passive.desc: "Every third basic attack lands like falling stone: bonus physical damage and a 30% slow for 1s."
hero.moc_lam.q.desc: "Charge 7.5 m along your aim, dealing physical damage and rooting the first champion hit."
hero.moc_lam.rmb.desc: "Brace like a mountain: shield yourself, scaling with max HP, for 3s."
hero.moc_lam.e.desc: "Sweep the blade in a full circle, striking every enemy nearby. You can keep moving while it spins."
hero.moc_lam.r.desc: "Leap onto an enemy and drive the blade into the vein: damage grows with their missing HP, then shield yourself and nearby allies."
hero.kha_tan.passive.desc: "Attacks and abilities write a debt mark that bleeds every second, stacking up to 5 times over 4s."
hero.kha_tan.q.desc: "Swing the scythe-axe in a half circle ahead. Heals for 30% of the damage dealt and adds a debt mark."
hero.kha_tan.rmb.desc: "Dash to a target and cut the tendon: damage and a 40% slow for 1.5s."
hero.kha_tan.e.desc: "Throw a chain hook along your aim, dragging the first enemy hit 5 m toward you."
hero.kha_tan.r.desc: "Call in the last debt: true damage that grows with each debt mark. A takedown refreshes it."
hero.mi_dang.passive.desc: "After each ability, the next attack carries a shade ember for bonus magic damage that grows per level."
hero.mi_dang.q.desc: "Send a lantern out and back. Enemies can be hit twice, going and returning."
hero.mi_dang.rmb.desc: "Slip like the moon through clouds onto a target, slashing for magic damage."
hero.mi_dang.e.desc: "Cast a beckoning call: the first enemy hit is charmed for 1.1s and walks toward you."
hero.mi_dang.r.desc: "Three fading steps through the enemy, each one a strike, untargetable while you move."
hero.hoa_tuy.passive.desc: "Abilities burn for 3% max HP over 3s and cut the target's healing by 40%."
hero.hoa_tuy.q.desc: "A pillar of fire erupts at the target spot after 0.7s, dealing damage and stunning for 0.75s."
hero.hoa_tuy.rmb.desc: "Fire a coal that marks the enemy. Your next damage on them detonates the mark for bonus magic damage."
hero.hoa_tuy.e.desc: "Release a heat wave around you: damage, a 3 m knockback and a 25% slow."
hero.hoa_tuy.r.desc: "Call down a coal meteor up to 18 m away; it lands after 1s and blasts the whole area."
hero.nham_vu.passive.desc: "Every fourth arrow is a heavy pebble, slowing the target 20% for 1s."
hero.nham_vu.q.desc: "Loose three arrows in a fan ahead of you."
hero.nham_vu.rmb.desc: "Draw the amber string for a 16 m charged shot: heavy damage and a 40% slow."
hero.nham_vu.e.desc: "Release the pathfinder bird: leap back 4 m, shed slows and roots, gain move and attack speed for 3.5s."
hero.nham_vu.r.desc: "Kick off the cliff 6 m back, then loose a piercing lance 18 m through every enemy in line."
hero.van_dao.passive.desc: "After each ability, your next attack forks lightning for bonus magic damage that grows per level."
hero.van_dao.q.desc: "Gather a storm cloud at a spot: damages enemies inside and heals you and allies."
hero.van_dao.rmb.desc: "Cast a wind seal along your aim, rooting the first enemy hit for 1.5s."
hero.van_dao.e.desc: "Don the storm cloak: a shield, 20% move speed, wind that clears bleeds and knocks back nearby enemies."
hero.van_dao.r.desc: "A great gale bursts around you, knocking enemies back 6 m and healing every ally inside."
hero.hao_nhat.passive.desc: "After each shield, your next attack sears with sunlight: bonus magic damage and a slow."
hero.hao_nhat.q.desc: "Charge with your shield along your aim, stunning the first enemy champion in the way."
hero.hao_nhat.rmb.desc: "Shield yourself; when it breaks or expires, sunlight bursts around you for magic damage."
hero.hao_nhat.e.desc: "Cast a tether of light that passes through minions, stopping at the first enemy champion and slowing it."
hero.hao_nhat.r.desc: "Two pillars of sunlight strike an area 0.6 s apart; the second stuns."
hero.huong_mai.passive.desc: "Each basic attack that lands shortens the cooldowns of Q, right-click and E."
hero.huong_mai.q.desc: "A beam of light that damages the first enemy hit and heals the most wounded ally in range."
hero.huong_mai.rmb.desc: "Throw a scented ring that flies out and returns, hitting twice and slowing."
hero.huong_mai.e.desc: "Raise a wall of light across the path: enemies who touch it are heavily slowed."
hero.huong_mai.r.desc: "A field of light warns for 1 s, then bursts: damages enemies and heals you and allies inside."
