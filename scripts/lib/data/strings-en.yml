lore.title: "The Memory Crystals"
lore.p1: "About a million years before 2300, the Cổ Linh civilisation flourished on the land that is now Vietnam. The Great Silence severed history; nearly every trace of its alliances vanished."
lore.p2: "In 2300, Vietnamese miners unearth the Memory Crystals and use Synchronised Recall to become the Cổ Linh, replaying battles stored in the crystal. It is memory, not time travel."
lore.p3: "Minh Ước faces Triều Vực on the Ninefold Veins. Whoever breaks the enemy's Heart Vein rewrites that memory."
hero.moc_lam.bio: "Mộc Lẫm raised Minh Ước's last gate, yet always left a way open for those fleeing. As the battlefield's memory shatters, he still remembers a voice calling from beyond the gate."
hero.kha_tan.bio: "Kha Tàn records every tactical debt on his chain of scales. He sides with Triều Vực, convinced a world that lives on borrowed power will soon collapse."
hero.mi_dang.bio: "Mị Đăng keeps the vault of memories of the lost. She joins the battle to follow a voice that exists in no record."
hero.hoa_tuy.bio: "Hỏa Tủy tends a furnace deep beneath the Ninefold Veins. When it began to breathe out memories instead of heat, he left his post to find out why."
hero.nham_vu.bio: "Nham Vũ charts flight paths through the memory storms. Her bird keeps the last coordinates of places the Cổ Linh maps no longer know."
hero.van_dao.bio: "Vân Dao once calmed the plasma storms around the sky terraces. When the two alliances cracked the heavens, she chose to heal rather than seal the sky."
hero.hao_nhat.bio: "Hạo Nhật kept the orbital mirrors of the Accord. He once held his shield over the escape route of a city losing its gravity."
hero.huong_mai.bio: "Hương Mai was the Accord's field physician. She uses light to stitch damaged layers of memory back together, and left her last message inside a Starstone."
