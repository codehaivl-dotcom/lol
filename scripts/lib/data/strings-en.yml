# R1 2026-10-11 · Bách Diện
hero.bach_dien.name: "Bách Diện"
hero.bach_dien.epithet: "Bronze Mirror Dancer"
hero.bach_dien.role: "Dancing battle mage"
hero.bach_dien.passive: "Silk Tempo"
hero.bach_dien.lmb: "Mirror Flick"
hero.bach_dien.q: "Turning Mirror"
hero.bach_dien.rmb: "Jeté Step"
hero.bach_dien.e: "Silk Spin"
hero.bach_dien.r: "Dance of a Hundred Mirrors"
hero.bach_dien.bio: "Bách Diện is the bronze-mirror dancer of the old dance halls. She fights as she dances: every skill a step, every mirror a beat."
hero.bach_dien.passive.desc: "When a skill hits, her next basic attack deals bonus magic damage and she moves 20% faster for 1.5 s."
hero.bach_dien.q.desc: "Spin a full turn and throw a mirror that passes minions, stops on the first enemy hero and slows."
hero.bach_dien.rmb.desc: "A jeté dash along your aim, dealing magic damage to enemies in the way."
hero.bach_dien.e.desc: "Spin 3.5 m, untargetable for 0.5 s, then gain 30% move speed for 2 s."
hero.bach_dien.r.desc: "Dance inside a 4.5 m ring of mirrors: three magic-damage beats 0.6 s apart; the third stuns."
hero.ngu_dang.name: "Ngư Đăng"
hero.ngu_dang.epithet: "Bell-Bearing Moon Bear"
hero.ngu_dang.role: "Protective tank"
hero.ngu_dang.passive: "Gathering Toll"
hero.ngu_dang.lmb: "Bell Lash"
hero.ngu_dang.q: "Bell Throw"
hero.ngu_dang.rmb: "Bell of Kinship"
hero.ngu_dang.e: "Chain Sweep"
hero.ngu_dang.r: "Echo Cage"
hero.ngu_dang.bio: "Ngư Đăng is the moon-chested bear who guards the mountain pass. His bronze bell calls the caravan home; in battle it calls his allies to him."
hero.ngu_dang.passive.desc: "Each Bell Lash that hits cuts 0.8 s off his basic skills' cooldowns, at most once per skill per cooldown and once every 0.5 s."
hero.ngu_dang.q.desc: "After a 0.5 s aim along a thick chain line, hurl the bronze bell on its chain: the first enemy hit takes magic damage, is pulled up to 6 m toward him and stunned 0.5 s."
hero.ngu_dang.rmb.desc: "Plant the bell at his feet: he and allies within 6 m gain a shield for 3 s."
hero.ngu_dang.e.desc: "Sweep the bell chain in a 3.5 m ring at a point up to 6 m away: magic damage and 40% slow for 1.5 s."
hero.ngu_dang.r.desc: "Three phantom bronze bells drop around him into a 5 m cage: enemies inside take magic damage and are rooted 1.5 s as the toll echoes."
hero.mac_lien.name: "Mặc Liên"
hero.mac_lien.epithet: "The Lacquer Painter"
hero.mac_lien.role: "Teamfight mage"
hero.mac_lien.passive: "Wipe Clean"
hero.mac_lien.lmb: "Vermilion Flick"
hero.mac_lien.q: "Three Strokes"
hero.mac_lien.rmb: "Blooming Lacquer"
hero.mac_lien.e: "Slipping Stroke"
hero.mac_lien.r: "Final Stroke"
hero.mac_lien.bio: "Mặc Liên is the Ancient of lacquer laid over memory, stratum on stratum. Vermilion and black, hard as glaze, inlaid with eggshell: every stroke of her brush repaints the fight."
hero.mac_lien.passive.desc: "After each skill, her next basic attack flicks vermilion for bonus magic damage."
hero.mac_lien.q.desc: "Flick three vermilion strokes in a 30° fan; each flies straight and deals magic damage. Up close all three can hit."
hero.mac_lien.rmb.desc: "Throw a piercing ball of lacquer that blooms as it flies, dealing magic damage and slowing 30% for 1.5 s."
hero.mac_lien.e.desc: "Slip 4.5 m toward a target and burst lacquer where you land for magic damage."
hero.mac_lien.r.desc: "Dip the brush and paint a 5.5 m vermilion ring; the closing stroke deals heavy magic damage and knocks enemies back."
hero.cot_ben.name: "Cốt Bện"
hero.cot_ben.epithet: "The Paddy Mud Man"
hero.cot_ben.role: "Engage tank"
hero.cot_ben.passive: "Souring Mud"
hero.cot_ben.lmb: "Mud Slap"
hero.cot_ben.q: "Bamboo Harrow"
hero.cot_ben.rmb: "Mud Spray"
hero.cot_ben.e: "Mud Scoop"
hero.cot_ben.r: "Mud Burial"
hero.cot_ben.bio: "Cốt Bện is old paddy mud that stood up after the flood, braided straw for sinew and rice seedlings on its back. It wades into the enemy line, drags the far ones in and buries them in its belly."
hero.cot_ben.passive.desc: "Skills that hit a champion smear sour mud: burn 2% of the target's max HP over 3 s and reduce its healing by 30%."
hero.cot_ben.q.desc: "Throw a bamboo harrow 12 m straight ahead; minions block it. The first champion hit takes physical damage and is dragged to your side."
hero.cot_ben.rmb.desc: "Spray a 100° cone of mud 3.5 m ahead: magic damage and a 50% slow for 1.5 s."
hero.cot_ben.e.desc: "Scoop an enemy within 2.5 m out of the mud: physical damage plus 8% of its missing HP; heal for half the damage."
hero.cot_ben.r.desc: "Lunge at a champion within 3 m and bury it in your mud belly: both are untargetable for 1.75 s, the victim cannot act, then it is spat out with magic damage."
