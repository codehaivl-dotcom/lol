tip.hoa_tuy.passive: "Burn enemies hit by your abilities for magic damage equal to {burn}% of their max HP over {dur} s and reduce their healing by {anti}%."
tip.hoa_tuy.lmb: "Hurl an ember at a target within {range} m for magic damage equal to 100% AD (+{ap}% AP)."
tip.hoa_tuy.q: "Raise a fire pillar at a spot within {range} m: after {delay} s it deals {dmg} (+{ap}% AP) magic damage within {radius} m and stuns for {stun} s."
tip.hoa_tuy.rmb: "Fire a coal {range} m, dealing {dmg} (+{ap}% AP) magic damage and marking the first enemy hit for {markDur} s. Your next hit on it detonates the mark for {mark} (+{markAp}% AP) bonus damage."
tip.hoa_tuy.e: "Release a heat wave in a {radius} m radius, dealing {dmg} (+{ap}% AP) magic damage, knocking enemies back {knock} m and slowing them by {slow}% for {slowDur} s."
tip.hoa_tuy.r: "Call a meteor onto a spot within {range} m: after {delay} s it explodes in a {radius} m radius for {dmg} (+{ap}% AP) magic damage."
tip.nham_vu.passive: "Slow the target by {slow}% for {slowDur} s with every {nth} basic attack."
tip.nham_vu.lmb: "Shoot a pebble arrow at a target within {range} m for physical damage equal to 100% AD."
tip.nham_vu.q: "Loose {count} arrows in a {spread}° fan, flying {range} m; each arrow pierces every enemy it touches for {dmg} (+{ad}% AD) physical damage. The gaps between arrows deal nothing; several arrows on one enemy count once."
tip.nham_vu.rmb: "Charge for {windup} s, then fire a {range} m shot dealing {dmg} (+{ad}% AD) physical damage to the first enemy hit and slowing it by {slow}% for {slowDur} s."
tip.nham_vu.e: "Leap back {dash} m, remove slows and roots, and gain {ms}% move speed and {as}% attack speed for {buffDur} s."
tip.nham_vu.r: "Leap {dash} m back, then hurl a piercing lance {range} m, dealing {dmg} (+{bad}% bonus AD) physical damage to every enemy in its path."
tip.van_dao.passive: "Empower your next basic attack after each ability cast: it forks lightning for {bonus} (+{bonusAp}% AP, +{perLv} per level) bonus magic damage."
tip.van_dao.lmb: "Fire a forked bolt at a target within {range} m for magic damage equal to 100% AD (+{ap}% AP)."
tip.van_dao.q: "Gather a cloud at a spot within {range} m: after {delay} s it deals {dmg} (+{ap}% AP) magic damage to enemies and heals you and allies within {radius} m for {heal} (+{healAp}% AP)."
tip.van_dao.rmb: "Cast a wind seal {range} m along your aim, dealing {dmg} (+{ap}% AP) magic damage and rooting the first enemy hit for {root} s."
tip.van_dao.e: "Shield yourself for {shield} (+{shAp}% AP) for {shDur} s, gain {ms}% move speed for {buffDur} s and remove slows, roots and bleeds. Enemies within {pushR} m are knocked back {knock} m and slowed by {pushSlow}% for {pushSlowDur} s. While the shield holds, your body blocks enemy shots aimed at allies behind you."
tip.van_dao.r: "Unleash a gale in a {radius} m radius, dealing {dmg} (+{ap}% AP) magic damage, knocking enemies back {knock} m and healing you and allies inside for {heal} (+{healAp}% AP)."
tip.hao_nhat.passive: "After each shield you raise, your next basic attack sears for {bonus} (+{bonusAp}% AP, +{perLv} per level) bonus magic damage and slows by {slow}% for {slowDur} s."
tip.hao_nhat.lmb: "Slash a target within {range} m for physical damage equal to 100% AD."
tip.hao_nhat.q: "Charge {dash} m with your shield along your aim. The first enemy champion in the way takes {dmg} (+{ap}% AP) magic damage and is stunned for {stun} s."
tip.hao_nhat.rmb: "Raise a shield of {shield} (+{shHp}% max HP) for {shDur} s. When it breaks or expires, sunlight bursts in a {burstR} m radius for {burst} (+{burstAp}% AP) magic damage."
tip.hao_nhat.e: "Cast a radiant tether {range} m along your aim that passes through minions and stops at the first enemy champion, dealing {dmg} (+{ap}% AP) magic damage and slowing by {slow}% for {slowDur} s."
tip.hao_nhat.r: "Call two pillars of sunlight on a {radius} m area within {range} m. The first strikes after {delay} s, the second {gap} s later; each deals {dmg} (+{ap}% AP) magic damage, and the second stuns for {stun} s."
tip.huong_mai.passive: "Each basic attack that lands takes {sec} s off the cooldowns of Q, right-click and E. Does not affect the ultimate."
tip.huong_mai.lmb: "Fire a dawn ray at a target within {range} m for magic damage equal to 100% AD (+{ap}% AP)."
tip.huong_mai.q: "Cast a beam {range} m along your aim: the first enemy hit takes {dmg} (+{ap}% AP) magic damage, and the most wounded ally in range is healed for {heal} (+{healAp}% AP)."
tip.huong_mai.rmb: "Throw a scented ring {range} m along your aim that returns to you. Each pass deals {dmg} (+{ap}% AP) magic damage and slows by {slow}% for {slowDur} s."
tip.huong_mai.e: "Raise a wall of light at a spot within {range} m, {radius} m wide: after {delay} s it deals {dmg} (+{ap}% AP) magic damage and slows by {slow}% for {slowDur} s."
tip.huong_mai.r: "Mark a {radius} m area within {range} m. After {delay} s daybreak bursts: enemies take {dmg} (+{ap}% AP) magic damage, and you and allies inside heal for {heal} (+{healAp}% AP)."
tip.meta.cd: "Cooldown {cd} s"
