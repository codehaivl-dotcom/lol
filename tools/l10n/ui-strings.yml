# --- mô tả chiêu (hero.<id>.<slot>.desc) ---
hero.moc_lam.passive.desc: { vi-VN: "Mỗi đòn đánh thứ ba nện như đá đổ: thêm sát thương vật lý và làm chậm mục tiêu 30% trong 1 giây.", en: "Every third basic attack lands like falling stone: bonus physical damage and a 30% slow for 1s." }
hero.moc_lam.q.desc: { vi-VN: "Lao thẳng 7,5 m theo hướng ngắm, gây sát thương vật lý và ghim chặt tướng đầu tiên trúng phải.", en: "Charge 7.5 m along your aim, dealing physical damage and rooting the first champion hit." }
hero.moc_lam.rmb.desc: { vi-VN: "Gồng vai như núi, dựng khiên cho bản thân theo máu tối đa trong 3 giây.", en: "Brace like a mountain: shield yourself, scaling with max HP, for 3s." }
hero.moc_lam.e.desc: { vi-VN: "Quét kiếm một vòng quanh thân, chém mọi kẻ địch gần bên. Vẫn đi được trong lúc quét.", en: "Sweep the blade in a full circle, striking every enemy nearby. You can keep moving while it spins." }
hero.moc_lam.r.desc: { vi-VN: "Nhảy tới một kẻ địch, cắm kiếm xuống mạch đất: sát thương tăng theo máu đã mất của mục tiêu, rồi dựng khiên cho cả đồng đội quanh đó.", en: "Leap onto an enemy and drive the blade into the vein: damage grows with their missing HP, then shield yourself and nearby allies." }
hero.kha_tan.passive.desc: { vi-VN: "Đòn đánh và chiêu ghi một tầng nợ máu lên mục tiêu, chảy máu mỗi giây, cộng dồn tới 5 tầng trong 4 giây.", en: "Attacks and abilities write a debt mark that bleeds every second, stacking up to 5 times over 4s." }
hero.kha_tan.q.desc: { vi-VN: "Vung liềm rìu quét nửa vòng phía trước. Hồi máu bằng 30% sát thương gây ra và thêm một tầng nợ.", en: "Swing the scythe-axe in a half circle ahead. Heals for 30% of the damage dealt and adds a debt mark." }
hero.kha_tan.rmb.desc: { vi-VN: "Lướt tới mục tiêu, chém đứt gân: sát thương và làm chậm 40% trong 1,5 giây.", en: "Dash to a target and cut the tendon: damage and a 40% slow for 1.5s." }
hero.kha_tan.e.desc: { vi-VN: "Ném móc xích theo hướng ngắm, kéo kẻ địch đầu tiên trúng về phía mình 5 m.", en: "Throw a chain hook along your aim, dragging the first enemy hit 5 m toward you." }
hero.kha_tan.r.desc: { vi-VN: "Đòi nợ cuối: sát thương chuẩn tăng theo mỗi tầng nợ trên mục tiêu. Hạ gục thì chiêu hồi lại ngay.", en: "Call in the last debt: true damage that grows with each debt mark. A takedown refreshes it." }
hero.mi_dang.passive.desc: { vi-VN: "Sau mỗi lần dùng chiêu, đòn đánh kế tiếp mang theo đốm bóng, thêm sát thương phép tăng theo cấp.", en: "After each ability, the next attack carries a shade ember for bonus magic damage that grows per level." }
hero.mi_dang.q.desc: { vi-VN: "Thả chiếc đèn bay ra rồi quay về. Kẻ địch có thể trúng hai lần, lượt đi và lượt về.", en: "Send a lantern out and back. Enemies can be hit twice, going and returning." }
hero.mi_dang.rmb.desc: { vi-VN: "Lướt như trăng rẽ mây tới mục tiêu, chém một nhát sát thương phép.", en: "Slip like the moon through clouds onto a target, slashing for magic damage." }
hero.mi_dang.e.desc: { vi-VN: "Phóng lời vẫy gọi: kẻ địch đầu tiên trúng bị mê hoặc 1,1 giây và bước về phía Mị Đăng.", en: "Cast a beckoning call: the first enemy hit is charmed for 1.1s and walks toward you." }
hero.mi_dang.r.desc: { vi-VN: "Ba bước mờ liên tiếp xuyên qua kẻ địch, mỗi bước chém một lần và không thể bị chọn làm mục tiêu.", en: "Three fading steps through the enemy, each one a strike, untargetable while you move." }
hero.hoa_tuy.passive.desc: { vi-VN: "Chiêu trúng đích đốt mục tiêu 3% máu tối đa trong 3 giây và giảm 40% hồi máu nhận được.", en: "Abilities burn for 3% max HP over 3s and cut the target's healing by 40%." }
hero.hoa_tuy.q.desc: { vi-VN: "Gọi một cột lửa trồi lên tại điểm chọn sau 0,7 giây, gây sát thương và làm choáng 0,75 giây.", en: "A pillar of fire erupts at the target spot after 0.7s, dealing damage and stunning for 0.75s." }
hero.hoa_tuy.rmb.desc: { vi-VN: "Bắn viên than đánh dấu kẻ địch. Đòn sát thương kế tiếp lên mục tiêu kích nổ dấu, gây thêm sát thương phép.", en: "Fire a coal that marks the enemy. Your next damage on them detonates the mark for bonus magic damage." }
hero.hoa_tuy.e.desc: { vi-VN: "Thổi luồng khí nóng quanh thân: sát thương, đẩy lùi 3 m và làm chậm 25%.", en: "Release a heat wave around you: damage, a 3 m knockback and a 25% slow." }
hero.hoa_tuy.r.desc: { vi-VN: "Gọi thiên thạch than rơi xuống điểm xa tới 18 m sau 1 giây, nổ tung cả vùng.", en: "Call down a coal meteor up to 18 m away; it lands after 1s and blasts the whole area." }
hero.nham_vu.passive.desc: { vi-VN: "Mỗi mũi tên thứ tư là mũi sỏi nặng, làm chậm mục tiêu 20% trong 1 giây.", en: "Every fourth arrow is a heavy pebble, slowing the target 20% for 1s." }
hero.nham_vu.q.desc: { vi-VN: "Bắn ba mũi tên xoè hình quạt phía trước.", en: "Loose three arrows in a fan ahead of you." }
hero.nham_vu.rmb.desc: { vi-VN: "Kéo căng dây hổ phách, bắn phát nạp bay xa 16 m, gây sát thương lớn và làm chậm 40%.", en: "Draw the amber string for a 16 m charged shot: heavy damage and a 40% slow." }
hero.nham_vu.e.desc: { vi-VN: "Thả chim mở lối, nhảy lùi 4 m, gỡ mọi làm chậm và trói, tăng tốc chạy và tốc đánh trong 3,5 giây.", en: "Release the pathfinder bird: leap back 4 m, shed slows and roots, gain move and attack speed for 3.5s." }
hero.nham_vu.r.desc: { vi-VN: "Lùi khỏi vách 6 m rồi phóng mũi lao xuyên thẳng 18 m, trúng mọi kẻ địch trên đường.", en: "Kick off the cliff 6 m back, then loose a piercing lance 18 m through every enemy in line." }
hero.van_dao.passive.desc: { vi-VN: "Sau mỗi lần dùng chiêu, đòn đánh kế tiếp rẽ tia sét, thêm sát thương phép tăng theo cấp.", en: "After each ability, your next attack forks lightning for bonus magic damage that grows per level." }
hero.van_dao.q.desc: { vi-VN: "Tụ mây giông tại điểm chọn: sát thương kẻ địch trong vùng, hồi máu cho bản thân và đồng minh.", en: "Gather a storm cloud at a spot: damages enemies inside and heals you and allies." }
hero.van_dao.rmb.desc: { vi-VN: "Phóng ấn gió theo hướng ngắm, trói kẻ địch đầu tiên trúng trong 1,5 giây.", en: "Cast a wind seal along your aim, rooting the first enemy hit for 1.5s." }
hero.van_dao.e.desc: { vi-VN: "Khoác áo bão: khiên cho bản thân, tăng 20% tốc chạy, gió cuốn sạch chảy máu và đẩy lùi kẻ địch sát bên.", en: "Don the storm cloak: a shield, 20% move speed, wind that clears bleeds and knocks back nearby enemies." }
hero.van_dao.r.desc: { vi-VN: "Sóng gió lớn toả quanh thân, đẩy lùi kẻ địch 6 m và hồi máu cho mọi đồng minh trong vùng.", en: "A great gale bursts around you, knocking enemies back 6 m and healing every ally inside." }
hero.hao_nhat.passive.desc: { vi-VN: "Sau mỗi lần dựng khiên, đòn đánh kế tiếp đốt nắng: thêm sát thương phép và làm chậm.", en: "After each shield, your next attack sears with sunlight: bonus magic damage and a slow." }
hero.hao_nhat.q.desc: { vi-VN: "Xông khiên theo hướng ngắm, choáng tướng địch đầu tiên chặn đường.", en: "Charge with your shield along your aim, stunning the first enemy champion in the way." }
hero.hao_nhat.rmb.desc: { vi-VN: "Dựng khiên cho bản thân; khi vỡ hoặc hết hạn, nắng nổ quanh thân gây sát thương phép.", en: "Shield yourself; when it breaks or expires, sunlight bursts around you for magic damage." }
hero.hao_nhat.e.desc: { vi-VN: "Phóng dây sáng xuyên lính, dừng ở tướng địch đầu tiên và làm chậm.", en: "Cast a tether of light that passes through minions, stopping at the first enemy champion and slowing it." }
hero.hao_nhat.r.desc: { vi-VN: "Hai cột nắng giáng xuống một vùng, cách nhau 0,6 giây; nhịp hai choáng.", en: "Two pillars of sunlight strike an area 0.6 s apart; the second stuns." }
hero.huong_mai.passive.desc: { vi-VN: "Mỗi đòn đánh trúng rút ngắn hồi chiêu Q, chuột phải và E.", en: "Each basic attack that lands shortens the cooldowns of Q, right-click and E." }
hero.huong_mai.q.desc: { vi-VN: "Tia sáng gây sát thương kẻ địch đầu tiên trúng và chữa đồng minh yếu nhất trong tầm.", en: "A beam of light that damages the first enemy hit and heals the most wounded ally in range." }
hero.huong_mai.rmb.desc: { vi-VN: "Ném vòng hương bay ra rồi quay về, trúng hai lượt và làm chậm.", en: "Throw a scented ring that flies out and returns, hitting twice and slowing." }
hero.huong_mai.e.desc: { vi-VN: "Dựng tường ánh sáng chặn lối: kẻ địch chạm vào bị làm chậm nặng.", en: "Raise a wall of light across the path: enemies who touch it are heavily slowed." }
hero.huong_mai.r.desc: { vi-VN: "Vùng sáng báo trước 1 giây rồi nổ: sát thương kẻ địch, chữa bản thân và đồng minh trong vùng.", en: "A field of light warns for 1 s, then bursts: damages enemies and heals you and allies inside." }
