# --- truyền thuyết (01) ---
lore.title: { vi-VN: "Tinh Thạch Ký Ức", en: "The Memory Crystals" }
lore.p1: { vi-VN: "Khoảng một triệu năm trước năm 2300, nền văn minh Cổ Linh phát triển rực rỡ trên vùng đất nay là Việt Nam. Đại Tịch cắt đứt chuỗi lịch sử; dấu tích và ký ức về các liên minh gần như biến mất.", en: "About a million years before 2300, the Cổ Linh civilisation flourished on the land that is now Vietnam. The Great Silence severed history; nearly every trace of its alliances vanished." }
lore.p2: { vi-VN: "Năm 2300, người Việt Nam khai thác được Tinh Thạch Ký Ức và dùng Hồi Tưởng Đồng Bộ để hóa thân vào các Cổ Linh, tái hiện những trận chiến được lưu trong tinh thạch. Đây là mô phỏng ký ức, không phải du hành thời gian.", en: "In 2300, Vietnamese miners unearth the Memory Crystals and use Synchronised Recall to become the Cổ Linh, replaying battles stored in the crystal. It is memory, not time travel." }
lore.p3: { vi-VN: "Minh Ước đối đầu Triều Vực trên Cửu Mạch Chiến Trường. Đội nào phá được Tâm Mạch của đối phương sẽ viết lại ký ức ấy.", en: "Minh Ước faces Triều Vực on the Ninefold Veins. Whoever breaks the enemy's Heart Vein rewrites that memory." }
# --- tiểu sử tướng (03-danh-sach-tuong.md) ---
hero.moc_lam.bio: { vi-VN: "Mộc Lẫm từng dựng cổng chắn cuối cùng cho Minh Ước, nhưng luôn để một lối mở cho người sơ tán. Khi ký ức chiến trường vỡ vụn, anh vẫn nhớ tiếng gọi từ phía bên kia cánh cổng.", en: "Mộc Lẫm raised Minh Ước's last gate, yet always left a way open for those fleeing. As the battlefield's memory shatters, he still remembers a voice calling from beyond the gate." }
hero.kha_tan.bio: { vi-VN: "Kha Tàn ghi lại mọi món nợ chiến thuật lên chuỗi vảy của mình. Hắn theo Triều Vực vì tin một thế giới chỉ tồn tại bằng cách vay mượn năng lượng sẽ sớm sụp đổ.", en: "Kha Tàn records every tactical debt on his chain of scales. He sides with Triều Vực, convinced a world that lives on borrowed power will soon collapse." }
hero.mi_dang.bio: { vi-VN: "Mị Đăng quản kho ký ức của những người đã mất. Cô gia nhập chiến trường để lần theo một giọng nói không có trong bất kỳ bản lưu nào.", en: "Mị Đăng keeps the vault of memories of the lost. She joins the battle to follow a voice that exists in no record." }
hero.hoa_tuy.bio: { vi-VN: "Hỏa Tủy vận hành một lò nhiệt sâu dưới nền Cửu Mạch. Khi lò bắt đầu phát ra ký ức thay vì năng lượng, anh rời vị trí canh giữ để tìm nguyên nhân.", en: "Hỏa Tủy tends a furnace deep beneath the Ninefold Veins. When it began to breathe out memories instead of heat, he left his post to find out why." }
hero.nham_vu.bio: { vi-VN: "Nham Vũ mở tuyến bay qua vùng nhiễu ký ức. Con chim của cô lưu tọa độ cuối cùng của những nơi mà bản đồ Cổ Linh không còn nhận ra.", en: "Nham Vũ charts flight paths through the memory storms. Her bird keeps the last coordinates of places the Cổ Linh maps no longer know." }
hero.van_dao.bio: { vi-VN: "Vân Dao từng điều hòa bão plasma quanh các thềm bay. Cô chọn chữa lành thay vì khóa bầu khí quyển khi hai liên minh làm tầng trời rạn nứt.", en: "Vân Dao once calmed the plasma storms around the sky terraces. When the two alliances cracked the heavens, she chose to heal rather than seal the sky." }
hero.hao_nhat.bio: { vi-VN: "Hạo Nhật là người giữ các gương quỹ đạo của Minh Ước. Anh từng dùng khiên của mình che lối rút khỏi một thành phố đang mất trọng lực.", en: "Hạo Nhật kept the orbital mirrors of the Accord. He once held his shield over the escape route of a city losing its gravity." }
hero.huong_mai.bio: { vi-VN: "Hương Mai là bác sĩ trường lực của Minh Ước. Cô dùng ánh sáng để nối lại các lớp ký ức bị tổn thương và để lại thông điệp cuối trong một Tinh Thạch.", en: "Hương Mai was the Accord's field physician. She uses light to stitch damaged layers of memory back together, and left her last message inside a Starstone." }
