# hiện là hằng số trong scripts/hero.js (chưa có trong heroes.yml) — tooltip.js giữ bản sao ở RUNTIME, xem report tooltip-2026-10-08.
tip.moc_lam.passive: { vi-VN: "Gây thêm {bonus} (+{bonusAd}% công vật lý) sát thương vật lý ở mỗi đòn đánh thứ {n} và làm chậm mục tiêu {slow}% trong {slowDur} giây.", en: "Deal {bonus} (+{bonusAd}% AD) bonus physical damage on every {nth} basic attack and slow the target by {slow}% for {slowDur} s." }
tip.moc_lam.lmb: { vi-VN: "Chém một mục tiêu trong {range} m, gây sát thương vật lý bằng 100% công vật lý.", en: "Strike a target within {range} m for physical damage equal to 100% AD." }
tip.moc_lam.q: { vi-VN: "Lao {dash} m theo hướng ngắm, gây {dmg} (+{bad}% công vật lý cộng thêm) sát thương vật lý lên kẻ địch đầu tiên trúng và trói nó {root} giây.", en: "Dash {dash} m along your aim, dealing {dmg} (+{bad}% bonus AD) physical damage to the first enemy hit and rooting it for {root} s." }
tip.moc_lam.rmb: { vi-VN: "Dựng khiên {shield} (+{shHp}% máu tối đa) cho bản thân trong {shDur} giây.", en: "Shield yourself for {shield} (+{shHp}% max HP) for {shDur} s." }
tip.moc_lam.e: { vi-VN: "Quét kiếm một vòng bán kính {radius} m quanh thân, gây {dmg} (+{ad}% công vật lý) sát thương vật lý lên mọi kẻ địch trúng.", en: "Sweep a {radius} m circle around you, dealing {dmg} (+{ad}% AD) physical damage to every enemy hit." }
tip.moc_lam.r: { vi-VN: "Nhảy tới kẻ địch trong {range} m, gây {dmg} (+{bad}% công vật lý cộng thêm, +{miss}% máu đã mất của mục tiêu) sát thương vật lý. Dựng khiên {shield} cho bản thân và đồng minh trong {allyR} m trong {shDur} giây.", en: "Leap onto an enemy within {range} m, dealing {dmg} (+{bad}% bonus AD, +{miss}% of the target's missing HP) physical damage. Shield yourself and allies within {allyR} m for {shield} for {shDur} s." }
tip.kha_tan.passive: { vi-VN: "Gắn một tầng chảy máu bằng đòn đánh, Liềm Rìu và Chém Gân: mỗi tầng gây {bleed} (+{bleedBad}% công vật lý cộng thêm) sát thương vật lý mỗi giây trong {dur} giây, cộng dồn tối đa {stacks} tầng.", en: "Basic attacks, Reaping Crescent and Hamstring Cut apply a bleed stack: each stack deals {bleed} (+{bleedBad}% bonus AD) physical damage per second for {dur} s, up to {stacks} stacks." }
tip.kha_tan.lmb: { vi-VN: "Chém một mục tiêu trong {range} m, gây sát thương vật lý bằng 100% công vật lý.", en: "Strike a target within {range} m for physical damage equal to 100% AD." }
tip.kha_tan.q: { vi-VN: "Vung liềm rìu quanh thân, sau {delay} giây gây {dmg} (+{ad}% công vật lý) sát thương vật lý trong bán kính {radius} m. Hồi máu bằng {share}% sát thương gây ra và gắn 1 tầng chảy máu.", en: "Swing the scythe-axe around you; after {delay} s deal {dmg} (+{ad}% AD) physical damage within {radius} m. Heal for {share}% of the damage dealt and apply 1 bleed stack." }
tip.kha_tan.rmb: { vi-VN: "Lướt tới mục tiêu trong {range} m, gây {dmg} (+{ad}% công vật lý) sát thương vật lý, làm chậm {slow}% trong {slowDur} giây và gắn 1 tầng chảy máu.", en: "Dash to a target within {range} m, dealing {dmg} (+{ad}% AD) physical damage, slowing it by {slow}% for {slowDur} s and applying 1 bleed stack." }
tip.kha_tan.e: { vi-VN: "Phóng móc xích {range} m theo hướng ngắm, gây {dmg} (+{bad}% công vật lý cộng thêm) sát thương vật lý và kéo kẻ địch đầu tiên trúng về phía mình tối đa {pull} m.", en: "Throw a chain hook {range} m along your aim, dealing {dmg} (+{bad}% bonus AD) physical damage and pulling the first enemy hit up to {pull} m toward you." }
tip.kha_tan.r: { vi-VN: "Chém kẻ địch trong {range} m, gây {dmg} (+{bad}% công vật lý cộng thêm) sát thương chuẩn, tăng {stk}% với mỗi tầng chảy máu trên mục tiêu. Hạ gục tướng thì hồi chiêu được làm mới.", en: "Cleave an enemy within {range} m for {dmg} (+{bad}% bonus AD) true damage, increased by {stk}% per bleed stack on the target. A champion kill resets the cooldown." }
tip.mi_dang.passive: { vi-VN: "Cường hoá đòn đánh kế tiếp sau mỗi lần dùng chiêu: gây thêm {bonus} (+{bonusAp}% công phép, +{perLv} mỗi cấp) sát thương phép.", en: "Empower your next basic attack after each ability cast: it deals {bonus} (+{bonusAp}% AP, +{perLv} per level) bonus magic damage." }
tip.mi_dang.lmb: { vi-VN: "Bắn đốm sáng tới mục tiêu trong {range} m, gây sát thương phép bằng 100% công vật lý (+{ap}% công phép).", en: "Fire a wisp at a target within {range} m for magic damage equal to 100% AD (+{ap}% AP)." }
tip.mi_dang.q: { vi-VN: "Thả đèn bay {range} m rồi quay về, gây {dmg} (+{ap}% công phép) sát thương phép mỗi lần trúng; một kẻ địch có thể trúng {hits} lần.", en: "Send a lantern {range} m out and back, dealing {dmg} (+{ap}% AP) magic damage per hit; an enemy can be hit {hits} times." }
tip.mi_dang.rmb: { vi-VN: "Lướt tới mục tiêu trong {range} m, chém {dmg} (+{ap}% công phép) sát thương phép.", en: "Dash to a target within {range} m and slash for {dmg} (+{ap}% AP) magic damage." }
tip.mi_dang.e: { vi-VN: "Phóng lời vẫy gọi {range} m theo hướng ngắm, gây {dmg} (+{ap}% công phép) sát thương phép và mê hoặc kẻ địch đầu tiên trúng {charm} giây.", en: "Cast a beckoning call {range} m along your aim, dealing {dmg} (+{ap}% AP) magic damage and charming the first enemy hit for {charm} s." }
tip.mi_dang.r: { vi-VN: "Lướt tới mục tiêu trong {range} m và chém {hits} lần, mỗi lần {dmg} (+{ap}% công phép) sát thương phép. Không thể bị chọn làm mục tiêu trong {untarget} giây.", en: "Dash to a target within {range} m and strike {hits} times for {dmg} (+{ap}% AP) magic damage each. Become untargetable for {untarget} s." }
tip.hoa_tuy.passive: { vi-VN: "Đốt kẻ địch trúng chiêu, gây sát thương phép bằng {burn}% máu tối đa của nó trong {dur} giây và giảm {anti}% hồi máu nhận được.", en: "Burn enemies hit by your abilities for magic damage equal to {burn}% of their max HP over {dur} s and reduce their healing by {anti}%." }
tip.hoa_tuy.lmb: { vi-VN: "Ném than tới mục tiêu trong {range} m, gây sát thương phép bằng 100% công vật lý (+{ap}% công phép).", en: "Hurl an ember at a target within {range} m for magic damage equal to 100% AD (+{ap}% AP)." }
tip.hoa_tuy.q: { vi-VN: "Gọi cột lửa tại điểm chọn trong {range} m: sau {delay} giây gây {dmg} (+{ap}% công phép) sát thương phép trong bán kính {radius} m và làm choáng {stun} giây.", en: "Raise a fire pillar at a spot within {range} m: after {delay} s it deals {dmg} (+{ap}% AP) magic damage within {radius} m and stuns for {stun} s." }
tip.hoa_tuy.rmb: { vi-VN: "Bắn viên than {range} m, gây {dmg} (+{ap}% công phép) sát thương phép và đánh dấu kẻ địch đầu tiên trúng {markDur} giây. Đòn kế tiếp của bạn lên nó kích nổ dấu, gây thêm {mark} (+{markAp}% công phép) sát thương.", en: "Fire a coal {range} m, dealing {dmg} (+{ap}% AP) magic damage and marking the first enemy hit for {markDur} s. Your next hit on it detonates the mark for {mark} (+{markAp}% AP) bonus damage." }
tip.hoa_tuy.e: { vi-VN: "Thổi khí nóng bán kính {radius} m quanh thân, gây {dmg} (+{ap}% công phép) sát thương phép, đẩy lùi {knock} m và làm chậm {slow}% trong {slowDur} giây.", en: "Release a heat wave in a {radius} m radius, dealing {dmg} (+{ap}% AP) magic damage, knocking enemies back {knock} m and slowing them by {slow}% for {slowDur} s." }
tip.hoa_tuy.r: { vi-VN: "Gọi thiên thạch xuống điểm chọn trong {range} m: sau {delay} giây nổ bán kính {radius} m, gây {dmg} (+{ap}% công phép) sát thương phép.", en: "Call a meteor onto a spot within {range} m: after {delay} s it explodes in a {radius} m radius for {dmg} (+{ap}% AP) magic damage." }
tip.nham_vu.passive: { vi-VN: "Làm chậm mục tiêu {slow}% trong {slowDur} giây bằng mỗi mũi tên thứ {n}.", en: "Slow the target by {slow}% for {slowDur} s with every {nth} basic attack." }
tip.nham_vu.lmb: { vi-VN: "Bắn tên sỏi tới mục tiêu trong {range} m, gây sát thương vật lý bằng 100% công vật lý.", en: "Shoot a pebble arrow at a target within {range} m for physical damage equal to 100% AD." }
tip.nham_vu.q: { vi-VN: "Bắn chùm tên hình quạt rộng {width} m, bay {range} m, gây {dmg} (+{ad}% công vật lý) sát thương vật lý lên mọi kẻ địch trên đường.", en: "Loose a {width} m wide fan of arrows {range} m ahead, dealing {dmg} (+{ad}% AD) physical damage to every enemy in its path." }
tip.nham_vu.rmb: { vi-VN: "Nạp {windup} giây rồi bắn phát tên {range} m, gây {dmg} (+{ad}% công vật lý) sát thương vật lý và làm chậm kẻ địch đầu tiên trúng {slow}% trong {slowDur} giây.", en: "Charge for {windup} s, then fire a {range} m shot dealing {dmg} (+{ad}% AD) physical damage to the first enemy hit and slowing it by {slow}% for {slowDur} s." }
tip.nham_vu.e: { vi-VN: "Nhảy lùi {dash} m, gỡ làm chậm và trói, tăng {ms}% tốc chạy và {as}% tốc đánh trong {buffDur} giây.", en: "Leap back {dash} m, remove slows and roots, and gain {ms}% move speed and {as}% attack speed for {buffDur} s." }
tip.nham_vu.r: { vi-VN: "Lùi {dash} m rồi phóng mũi lao xuyên {range} m, gây {dmg} (+{bad}% công vật lý cộng thêm) sát thương vật lý lên mọi kẻ địch trên đường.", en: "Leap {dash} m back, then hurl a piercing lance {range} m, dealing {dmg} (+{bad}% bonus AD) physical damage to every enemy in its path." }
tip.van_dao.passive: { vi-VN: "Cường hoá đòn đánh kế tiếp sau mỗi lần dùng chiêu: rẽ tia sét gây thêm {bonus} (+{bonusAp}% công phép, +{perLv} mỗi cấp) sát thương phép.", en: "Empower your next basic attack after each ability cast: it forks lightning for {bonus} (+{bonusAp}% AP, +{perLv} per level) bonus magic damage." }
tip.van_dao.lmb: { vi-VN: "Phóng tia rẽ tới mục tiêu trong {range} m, gây sát thương phép bằng 100% công vật lý (+{ap}% công phép).", en: "Fire a forked bolt at a target within {range} m for magic damage equal to 100% AD (+{ap}% AP)." }
tip.van_dao.q: { vi-VN: "Tụ mây tại điểm chọn trong {range} m: sau {delay} giây gây {dmg} (+{ap}% công phép) sát thương phép lên kẻ địch và hồi {heal} (+{healAp}% công phép) máu cho bạn và đồng minh trong bán kính {radius} m.", en: "Gather a cloud at a spot within {range} m: after {delay} s it deals {dmg} (+{ap}% AP) magic damage to enemies and heals you and allies within {radius} m for {heal} (+{healAp}% AP)." }
tip.van_dao.rmb: { vi-VN: "Phóng ấn gió {range} m theo hướng ngắm, gây {dmg} (+{ap}% công phép) sát thương phép và trói kẻ địch đầu tiên trúng {root} giây.", en: "Cast a wind seal {range} m along your aim, dealing {dmg} (+{ap}% AP) magic damage and rooting the first enemy hit for {root} s." }
tip.van_dao.e: { vi-VN: "Dựng khiên {shield} (+{shAp}% công phép) cho bản thân trong {shDur} giây, tăng {ms}% tốc chạy trong {buffDur} giây và gỡ làm chậm, trói, chảy máu. Đẩy kẻ địch trong {pushR} m lùi {knock} m và làm chậm {pushSlow}% trong {pushSlowDur} giây. Khi khiên còn, thân bạn chắn đạn địch bắn vào đồng minh đứng phía sau.", en: "Shield yourself for {shield} (+{shAp}% AP) for {shDur} s, gain {ms}% move speed for {buffDur} s and remove slows, roots and bleeds. Enemies within {pushR} m are knocked back {knock} m and slowed by {pushSlow}% for {pushSlowDur} s. While the shield holds, your body blocks enemy shots aimed at allies behind you." }
tip.van_dao.r: { vi-VN: "Thổi sóng gió bán kính {radius} m quanh thân, gây {dmg} (+{ap}% công phép) sát thương phép, đẩy lùi kẻ địch {knock} m và hồi {heal} (+{healAp}% công phép) máu cho bạn và đồng minh trong vùng.", en: "Unleash a gale in a {radius} m radius, dealing {dmg} (+{ap}% AP) magic damage, knocking enemies back {knock} m and healing you and allies inside for {heal} (+{healAp}% AP)." }
# --- dòng phụ của tooltip (hồi chiêu / năng lượng) ---
tip.hao_nhat.passive: { vi-VN: "Sau mỗi lần dựng khiên, đòn đánh kế tiếp đốt nắng gây thêm {bonus} (+{bonusAp}% công phép, +{perLv} mỗi cấp) sát thương phép và làm chậm {slow}% trong {slowDur} giây.", en: "After each shield you raise, your next basic attack sears for {bonus} (+{bonusAp}% AP, +{perLv} per level) bonus magic damage and slows by {slow}% for {slowDur} s." }
tip.hao_nhat.lmb: { vi-VN: "Chém lưỡi kiếm tới mục tiêu trong {range} m, gây sát thương vật lý bằng 100% công vật lý.", en: "Slash a target within {range} m for physical damage equal to 100% AD." }
tip.hao_nhat.q: { vi-VN: "Xông khiên {dash} m theo hướng ngắm. Tướng địch đầu tiên chặn đường nhận {dmg} (+{ap}% công phép) sát thương phép và bị choáng {stun} giây.", en: "Charge {dash} m with your shield along your aim. The first enemy champion in the way takes {dmg} (+{ap}% AP) magic damage and is stunned for {stun} s." }
tip.hao_nhat.rmb: { vi-VN: "Dựng khiên {shield} (+{shHp}% máu tối đa) trong {shDur} giây. Khi khiên vỡ hoặc hết hạn, nắng nổ bán kính {burstR} m gây {burst} (+{burstAp}% công phép) sát thương phép.", en: "Raise a shield of {shield} (+{shHp}% max HP) for {shDur} s. When it breaks or expires, sunlight bursts in a {burstR} m radius for {burst} (+{burstAp}% AP) magic damage." }
tip.hao_nhat.e: { vi-VN: "Phóng dây sáng {range} m theo hướng ngắm, xuyên qua lính và dừng ở tướng địch đầu tiên: gây {dmg} (+{ap}% công phép) sát thương phép và làm chậm {slow}% trong {slowDur} giây.", en: "Cast a radiant tether {range} m along your aim that passes through minions and stops at the first enemy champion, dealing {dmg} (+{ap}% AP) magic damage and slowing by {slow}% for {slowDur} s." }
tip.hao_nhat.r: { vi-VN: "Gọi hai cột nắng xuống vùng bán kính {radius} m trong {range} m. Nhịp đầu giáng sau {delay} giây, nhịp hai sau thêm {gap} giây; mỗi nhịp gây {dmg} (+{ap}% công phép) sát thương phép, nhịp hai choáng {stun} giây.", en: "Call two pillars of sunlight on a {radius} m area within {range} m. The first strikes after {delay} s, the second {gap} s later; each deals {dmg} (+{ap}% AP) magic damage, and the second stuns for {stun} s." }
tip.huong_mai.passive: { vi-VN: "Mỗi đòn đánh trúng rút ngắn {sec} giây hồi chiêu của Q, chuột phải và E. Không rút ngắn chiêu cuối.", en: "Each basic attack that lands takes {sec} s off the cooldowns of Q, right-click and E. Does not affect the ultimate." }
tip.huong_mai.lmb: { vi-VN: "Bắn tia sớm tới mục tiêu trong {range} m, gây sát thương phép bằng 100% công vật lý (+{ap}% công phép).", en: "Fire a dawn ray at a target within {range} m for magic damage equal to 100% AD (+{ap}% AP)." }
tip.huong_mai.q: { vi-VN: "Phóng tia sáng {range} m theo hướng ngắm: kẻ địch đầu tiên trúng nhận {dmg} (+{ap}% công phép) sát thương phép; đồng minh yếu máu nhất trong tầm được hồi {heal} (+{healAp}% công phép) máu.", en: "Cast a beam {range} m along your aim: the first enemy hit takes {dmg} (+{ap}% AP) magic damage, and the most wounded ally in range is healed for {heal} (+{healAp}% AP)." }
tip.huong_mai.rmb: { vi-VN: "Ném vòng hương {range} m theo hướng ngắm rồi quay về. Mỗi lượt trúng gây {dmg} (+{ap}% công phép) sát thương phép và làm chậm {slow}% trong {slowDur} giây.", en: "Throw a scented ring {range} m along your aim that returns to you. Each pass deals {dmg} (+{ap}% AP) magic damage and slows by {slow}% for {slowDur} s." }
tip.huong_mai.e: { vi-VN: "Dựng tường ánh sáng tại điểm chọn trong {range} m, rộng {radius} m: sau {delay} giây gây {dmg} (+{ap}% công phép) sát thương phép và làm chậm {slow}% trong {slowDur} giây.", en: "Raise a wall of light at a spot within {range} m, {radius} m wide: after {delay} s it deals {dmg} (+{ap}% AP) magic damage and slows by {slow}% for {slowDur} s." }
tip.huong_mai.r: { vi-VN: "Đánh dấu vùng bán kính {radius} m trong {range} m. Sau {delay} giây ánh đầu ngày nổ: gây {dmg} (+{ap}% công phép) sát thương phép lên kẻ địch và hồi {heal} (+{healAp}% công phép) máu cho bạn và đồng minh trong vùng.", en: "Mark a {radius} m area within {range} m. After {delay} s daybreak bursts: enemies take {dmg} (+{ap}% AP) magic damage, and you and allies inside heal for {heal} (+{healAp}% AP)." }
