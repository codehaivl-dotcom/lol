      range: 6.5
      windup: 0.2
      cooldown: [75, 65, 55]
      cost: [100, 100, 100]
      dash: { distance: 6.5, toward: true }
      damage: { type: physical, base: [180, 280, 380], bonusAd: 1.15 }
