      windup: 0
      cooldown: [16, 15, 14, 13, 12]
      cost: [60, 60, 60, 60, 60]
      cleanse: true
      shield: { base: [80, 120, 160, 200, 240], maxHp: 0.05, duration: 2.5 }
    r:    # Sừng Băng: húc sừng băng lao xa, xuyên mọi kẻ trên đường, hất và choáng
      aim: skillshot
      width: 2.4
      speed: 18
      range: 12.0
      windup: 0.3
      pierce: true
      cooldown: [100, 85, 70]
      cost: [100, 100, 100]
      dash: { distance: 12.0, toward: true }
      damage: { type: magic, base: [110, 170, 230], ad: 0.4 }
      knockback: 3.0
      effects: [{ stun: 1.0 }]
