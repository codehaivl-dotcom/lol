# Minions + towers + structure life — the presentation numbers (combat numbers live in tuning.yml).
cap: 90                # live minions, all lanes
laneCap: 14            # live minions per team per lane; a new wave's extras are dropped past this
hover: 0.45            # metres the feet float over the ground
bob: 0.12              # hover bob amplitude
spawnSpacing: 1        # one minion per group per tick (0.1 s) — a column leaving the base
laneJitter: 3          # lateral spread when spawned
separation: 1.7        # minions push apart inside this
retargetEvery: 3       # ticks between aggro scans per minion (staggered)
leash: 4               # a chased target escapes past aggro + this
boltSpeed: { caster: 24, siege: 18 }
towerOrbSpeed: 30
towerChargeSeconds: 0.6    # (HUD audit 2026-10-05) long enough to read the lock beam and step out
towerCrystalY: 13.8     # crystal centre over a tower's feet (8.95 local × scale 1.4 + half the crystal)
keepCrystalY: 16.3      # the same on a keep (its central tower's crown stands where a tower's does, at scale 1.6, under a taller crystal)
# a keep is a tower to what fights (state.kind "tower", tier 2) and a fort to what walks: its walls are 5.1 m from its centre and its
# turrets reach 6.8 m (scripts/gen/rift-structure.js KPG at the rows' scale 1.6), so it has its own row beside the tower's (lib/structures.js sizeOf)
radius: { guardian: 2.2, minion: 0.5, super: 0.9, siege: 0.8, champion: 0.5, tower: 4.3, keep: 5.9, nexus: 9.5, monster: 1 }
# the solid disc a minion walks around (the drawn base plus a step of air); separate from attack reach above
avoid: { tower: 5.4, keep: 7.2, nexus: 10.5 }
armor: { tower: 40, nexus: 20 }
sfx:
  melee: /cdn/moodboard-painterly-fantasy/sfx-crystal-blade-clang.mp3
  caster: /cdn/moodboard-painterly-fantasy/sfx-crystal-caster-zap.mp3
  siege: /cdn/moodboard-painterly-fantasy/sfx-stone-cannon-thump.mp3
  bolt: /cdn/moodboard-painterly-fantasy/sfx-crystal-bolt-impact.mp3
  minionDie: /cdn/moodboard-painterly-fantasy/sfx-minion-crystal-shatter.mp3
  towerCharge: /cdn/moodboard-painterly-fantasy/sfx-crystal-tower-charge.mp3
  towerShot: /cdn/moodboard-painterly-fantasy/sfx-crystal-tower-orb-launch.mp3
  towerHit: /cdn/moodboard-painterly-fantasy/sfx-tower-orb-impact-heavy.mp3
  collapse: /cdn/moodboard-painterly-fantasy/sfx-tower-collapse-crystal-shatter.mp3
  restore: /cdn/moodboard-painterly-fantasy/sfx-crystal-restore-chime.mp3

# creep block (izkimar 2026-09-26): a minion marching into an allied champion slows up to maxSlow and sidesteps round; gentle, never a wall
creepBlock: { on: true, reach: 1.9, width: 1.15, maxSlow: 0.6, sidestep: 0.55 }

# ── model bodies (izkimar 2026-10-05): the lane minions wear Hero Lab creatures. hover/bob above stay for the mercs;
# a kind listed here stands on the ground (no hover, no bob). Read by scripts/minions.js (spawnMinion, bodyAct, loose, die).
# model/forward/skin are copied from @izkimar/hero-lab rows mw-footman(-red), bestiary-archer(-red), bestiary-mortarbrute(-red);
# skin: the model field the team set goes in (materials by slot, or parts by mesh). clips: only clips the model owns (its GLB's names).
# height: layout extents in m (a champion is ~1.8). len: each clip's own seconds. rate: playback speed. release: s from the swing's
# start to the blow / the shot leaving (the clip's peak, measured off the GLB, at that rate). muzzle: where a shot leaves, m from the
# feet (up, forward toward the target, side to its right). hitEvery/hitChance: the masked Hit flinch, rare. hold: s the corpse lies
# after Death ends before it is taken (the last 0.5 s it sinks).
