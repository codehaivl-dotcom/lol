  9:
    - { id: quick-tongue, name: Quick Tongue, slot: r, row: invoke, rec: true, text: "The wait between two casts is 0.3 s shorter.", mods: { lockout: "-0.3" } }
    - { id: kept-sign, name: Kept Sign, slot: r, row: invoke, text: "A cast spends 2 Signs: the first one you called stays, with its gift.", mods: { spend: 2 } }
