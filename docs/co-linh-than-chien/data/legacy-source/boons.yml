    - { id: long-lift, name: High Updraft, slot: e, text: "Updraft holds enemies aloft 0.4 s longer.", mods: { "effects.0.duration": "+0.4" } }
    - { id: fast-brand, name: Quick Brand, slot: rmb, text: "Cinder Brand recharges 20% sooner.", mods: { cooldown: "*0.8" } }
  9:
