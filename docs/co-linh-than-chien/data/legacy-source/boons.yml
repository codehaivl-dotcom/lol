# His finishes and his cast are the kit's `invoke` row, his ten spells the `spells` table (a field is <spell key>.<field>). A card is
# headed by the Sign it speaks of (q Frost, e Storm, rmb Stone), or by Foretell.
invoker:
  3:
    - { id: deep-frost, name: Deep Frost, slot: q, row: invoke, text: "Frost called last slows what the spell hits 35%.", mods: { "finish.quas.slow": 0.35 } }
    - { id: long-storm, name: Long Storm, slot: e, row: invoke, text: "Storm called last carries the spell 25% farther and faster.", mods: { "finish.wex.reach": 0.25 } }
    - { id: heavy-stone, name: Heavy Stone, slot: rmb, row: invoke, rec: true, text: "Stone called last makes the spell hit 18% harder.", mods: { "finish.exort.damage": 0.18 } }
  6:
    - { id: sharp-strike, name: Bright Strike, slot: rmb, row: spells, rec: true, text: "Sun Strike deals 25% more damage.", mods: { "eee.damage.base": "*1.25" } }
    - { id: cold-snap-long, name: Long Snap, slot: q, row: spells, text: "Cold Snap lasts 1 s longer.", mods: { "qqq.duration": "+1" } }
