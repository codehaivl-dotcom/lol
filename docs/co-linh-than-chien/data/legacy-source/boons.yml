# League of Spawn's boons: the talent picks a hero earns at levels. scripts/lib/boons.js is the rule; this file is the cards.
#
# rules      the system's own numbers and names. Every other top-level key is a hero id (a key of kits.yml):
#              <hero>: { <level>: [ card, card, card ] }
# A CARD     { id, name, slot, text, rec?, mods?, row?, more?, hp?, quest?, hook? }
#   id       unique inside its hero. state.boons stores it: a shipped id is never renamed.
#   name     the card's title.
#   slot     the button it changes: lmb | rmb | q | e | r | passive. The card is headed by that button's key and name.
#   text     one line with one number: what the button does now. The number is the one the player meets in play: an
#            ultimate's damage after tuning.yml fight.ultDamage, a cooldown's seconds after fight.basicCooldown (a card
#            that takes 3 s off a cooldown in play takes 4 s off its row).
#   rec      true on ONE card a tier: the mark a new player sees, and the card a bot takes.
#   mods     a patch of that slot's row in kits.yml, as THIS caster has it. field: value, where the value is
#              a number, a word, true, a list, a map     the field becomes it            pierce: 2 · returns: true
#              "*1.4"                                    the number (each rank of a list) times 1.4
#              "+2" / "-0.5"                             the number (each rank of a list) plus / minus
#            and the field is
#              a name                                    range · cooldown · pierce
#              a dotted name                             a field inside the row          damage.base · effects.0.duration · charge.rangeMax
#              a name ending in +                        the list gains the items        effects+: [{ kind: slow, amount: 0.3, duration: 2 }]
#            "*" and "+" change a number the row already holds; a field the row lacks is given its value outright.
#   row      the kit key the patch lands on when it is not the slot: a hero's own table (jaina: frostbite · invoker: invoke,
#            spells), or the button's row for a card headed by the passive (slot: passive, row: rmb). A passive card with
#            no row lands on the hero's passive row.
#   more     { <row>: patch }: a second row the same card changes.
#   hp       max health the card gives.
#   quest    { count, slot?, need, goal, then: { mods?, more?, hp? }, every?, step? }: the card counts first, then `then` turns on.
#              count: hit       enemy heroes struck by `slot` (one slot or a list; a struck body counts once a beat; any: true counts every
#                               enemy; on: <name> counts only a blow its hero's own module marked with that name, as Halla's marks a Stormbeat strike)
#                     takedown  kills and assists since the pick · cs: last hits since the pick
#              goal             the quest in the player's words (the HUD adds the count) · fx, sfx, flash: its own finish (an effect
#                               named in boon-hooks.js LOOKS or an effect file's path, a sound, a screen flash's colour)
#              every + step     each `every` counted, the patch `step` is laid once more (a number that grows on the way)
#            `mods` beside a quest hold from the pick.
#   hook     a name in scripts/lib/boon-hooks.js HOOKS, when neither a patch nor a rider says it.
# TWO RIDERS any row understands once a card patches them in (scripts/lib/boon-hooks.js reads them on a hit):
#   amp:   [{ when, value?, amount }]   the hit deals x (1 + amount) while `when` holds for its target:
#          any | slowed | rooted | held | chilled | marked | hero | minion | below (health share <= value) | above | far (>= value m away) | near
#   onHit: [{ kind, ..., hero?, kill?, every? }]   after a hit that dealt damage to an enemy (hero: heroes only · kill: it
#          killed · every: at most once in that many seconds):
#          heal { share of the damage | base, ap, hpRatio } · shield { base, ap, hpRatio, duration } · speed / attackSpeed { amount, duration }
#          refund { slot?, seconds } off a cooldown · mana { amount }
#
# TO ADD A HERO'S CARDS (data alone):
#   1. Add the hero's id as a key here, with one list per level of rules.tiers.
#   2. Write three cards a level. Give each an id, a name, the slot it changes and one line of text with one number.
#   3. Put the change in `mods`, in the words of that slot's row in kits.yml. Read the row first: a patch moves a field the
#      hero's code reads. A field no code reads changes nothing: scripts/test/boons.test.mjs lists every field a card
#      patches that its row does not hold.
#   4. Mark one card a level `rec: true`: the plainest one, a number a new player and a bot can use at once.
#   5. Make the three cards three ways to play the button, and keep them fair: a card that is right in every match is a stat.
#   6. A quest card says its goal in `quest.goal` (no count: the HUD adds it) and its prize in `text`, which opens
#      "When the quest is done, ".
#   7. Run node scripts/test/boons.test.mjs: it checks every hero has every tier, three cards, one recommended, unique ids,
#      a real slot, a patch that lands, and a line of text that is short.
#   8. A level added to rules.tiers (18, 21) needs only cards under that level and a row in rules.look.
rules:
  tiers: [3, 6, 9, 12, 15]   # a boon every 3 levels; 15 is the APEX capstone (izkimar 2026-10-05)
  offer: 3            # cards a tier shows
  rerolls: 1          # a match
  botDelay: 1.5       # s a bot waits before it takes the recommended card
  autoAfter: 30       # s OUT OF COMBAT a player's boon may wait unpicked before the recommended card is taken for them and the herald says so (their switch: settings.autoBoon; 0: never). Seconds in a fight, and seconds while the guide's boon lesson stands, do not count
  chimeDelay: 0.6     # s after the level's own sound
  questGap: 0.4       # s: one struck body counts once for a quest in this long
  look:               # a tier's word and colour on its cards
    3: { name: "BOON", color: "oklch(.78 .13 165)" }
    6: { name: "KEEN BOON", color: "oklch(.76 .14 220)" }
    9: { name: "ULTIMATE BOON", color: "oklch(.74 .17 305)" }
    12: { name: "GREAT BOON", color: "oklch(.84 .15 85)" }
    15: { name: "APEX", color: "oklch(.68 .22 28)" }
  sfx:
    ready: /cdn/moodboard-painterly-fantasy/sfx-boon-ready-soft-golden-chime-two-notes.mp3
    pick: /cdn/moodboard-painterly-fantasy/sfx-boon-card-chosen-warm-harp-pluck-shimmer.mp3
    quest: /cdn/moodboard-painterly-fantasy/sfx-boon-quest-complete-bright-bell-rise-chord.mp3
    reroll: /cdn/moodboard-painterly-fantasy/sfx-cards-shuffled-soft-paper-riffle.mp3

