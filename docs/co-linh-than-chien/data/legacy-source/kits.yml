zephira:
  name: Zephira
  title: The Storm Oracle
  story: "The last priestess of a sky temple the storm took a thousand years ago, Zephira has not aged a day since. She speaks for the thunderheads now: the gale that shields, the lightning that answers."
  combo: [rmb, q] # the slow, the storm (sent at half its gather); Stormward is a guard, Headwind a peel
  class: enchanter
  role: healer
  ult: { cost: 1050 }
  weapon: storm staff
  resource: mana
  color: [1.9, 1.5, 2.9] # the white-violet of her lightning: a white quick in the violet of her diadem's gem (never the white-blue of a minion's bolt)
