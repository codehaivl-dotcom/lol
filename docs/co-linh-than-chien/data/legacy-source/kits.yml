# ---- the two healers (scripts/lib/healers.js runs Ansel's blocks, scripts/healer-piece.js their pieces; Ysolde's rows are her own module's since 2026-10-04: lib/ysolde.js, her head below) ----
# On a slot: mend / ward / hour = a skillshot at an ally (a heal, a shield, a mark that gives lost health back); dawn = a line that
# heals; glass = marks round the caster. The fields of each block are listed at the head of lib/healers.js. The blocks are read
# off the row as its caster has it (lib/kit.js), so whoever wears the kit casts them.
# assist: ally = on a phone the tap picks the allied hero this row is for (lib/healer-aim.js). allies: true keeps the bots'
# line check and their dodge off the row, and a bot aims the row's ultimate at the ally it is pressed for (lib/bot-kit.js).
# The shot's rules, for every mend / ward / hour row: it passes minions, monsters and structures; the first allied hero that can
# take it ends it; the first enemy hero in its way blocks it; a wall stops it; the caster is never hit by its own shot, and
# neither is a hero level with the caster or behind it.
# brink (hour, glass): a mark turns at once when its hero falls under this share of the health it had WHEN MARKED.
# THE BAR. These two fill it by healing and shielding OTHER heroes (a heal on the caster pays nothing, a ward that lies on its
# caster pays what it soaks, the ultimate's own heal pays nothing) and clear no wave between fights: their costs sit at the low
# end of the roster's. ult.cost is the dial of how often a team sees First Light and The Unturned Glass.
# ---- Ansel, Chaplain of the Dawn Throne (the healers' pass of 2026-10-04; scripts/lib/ansel.js, scripts/ansel-piece.js) ----
# THE RHYTHM: he never stops firing. A Morning Bolt that strikes brings Mending Light back sooner (passive.hero / passive.other: the
#   seconds a bolt on an enemy hero / on any other enemy takes off Q's cooldown), so the heal is earned at the front, with the crosshair.
# q.mend: the aimed heal (the numbers lib/healers.js shotNumbers reads: heal, low + lowMult the saving light on an ally under `low` of
#   its health, refund, chain, block what an enemy hero who stands in its way takes).
# rmb.censer: the Thurible. The censer flies out `range` m at `speed` and strikes every enemy it passes (the row's damage and
#   effects); at its reach, or a wall, it comes home at `back` m/s and heals every allied hero it passes for `heal`. lit: a censer
#   that struck an enemy HERO on its way out comes home lit: it heals that much more, and it heals Ansel when he catches it.
# r.rise: First Light. After the row's `delay` a wave of light runs out over the row's cone at `speed` m/s: `heal` to every allied
#   hero it reaches (Ansel too), `shield` (3 s) with it, the row's damage and effects to every enemy. rays: the long rays of the sun the ground shows (a short one stands between each two).
# seat: where his own light hangs on his body (scripts/ansel-rider.js): bone = a joint of the FoundryRig, at = metres from it in the
