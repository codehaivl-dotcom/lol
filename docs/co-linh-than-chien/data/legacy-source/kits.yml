  rider: scripts/ansel-rider.js # the light in his staff's crystal, hung on his body's own socket (heroes/ansel.json sockets.crystal: it flares when a bolt kindles it and stands bright while Mending Light is ready), Kindle's bell, and his chain built ahead
  stats: { hp: 560, mana: 420, ad: 46, ap: 0, armor: 26, mr: 30, moveSpeed: 6.5, attackSpeed: 0.625, hpRegen: 5.5, manaRegen: 11 }
