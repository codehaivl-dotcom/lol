# Crownfall's nine champions — MOBA kits translated to aimed third person (the core-combat lane's).
# Every slot: name, type (melee|projectile|skillshot|dash|area|self|cone|line|bolts), cooldown (s), cost, range (m),
# radius/width (m), speed (m/s), damage { base, ad, ap, hpRatio, type }, effects [{ kind, … }] on what it hits,
# self [{ kind, … }] on the caster, windup (s), clip (a key of the hero body's clip map), desc (the HUD tooltip).
# Effect kinds: slow {amount, duration} stun root knockup silence charm {duration} shield {base, ad, ap, hpRatio, duration}
# heal {base, ad, ap} speed / attackSpeed {amount, duration} pull / knockback {distance} mark {duration} bleed {dps, duration}
# cleanse {of: [hold kinds]} (those holds fall off whoever it lands on: slow by default).
# lmb = the basic attack (cooldown comes from attackSpeed). A slot's rank comes from its hero's level (lib/ranks.js): no points to spend.
# A basic ability runs tuning.yml fight.basicCooldown of its cooldown here.
# r = the ultimate: it has NO cooldown. It casts from level 1 when its hero's bar is full (lib/charge.js): `ult: { cost }` on the hero is the
# charge points a full bar costs (tuning.yml ult says what pays). The first press of R that goes out empties the bar; a second press of
# the same ultimate (a throw, a spit, a return) is free. `ult: { none: true }`: no bar, R is not one spend (Auron). An
# ultimate's blows deal tuning.yml fight.ultDamage of the numbers here; its rank is 1 / 2 / 3 at the levels lib/ranks.js gives R.
# role: what the hero is for in a fight, one of tank | bruiser | assassin | mage | marksman | support | healer (lib/roles.js roleOf reads it: the menu,
# the draft, the bots' fill, the scoreboard, the charge a blow on a tank pays). class stays the shop's and the bots' word (build lines, item tabs).
# ---- MOBA alignment (2026-09-24) ----
# stats = MOBA base stats: moveSpeed = MOBA MS / 50; attackSpeed = MOBA base AS; growth per level, attackSpeed growth a
# fraction (3.65% -> 0.0365). hpRegen / manaRegen are the genre's PER-5 numbers (scripts/champion.js regen divides by 5 per second);
# energy (tenzo) regenerates 10/s in champion.js whatever manaRegen says. MOBA champions have 0 base AP.
# RANKS: rmb / q / e rank 1..5, r rank 1..3. On damage / tickDamage / shield / heal / healAllies specs (nested ones too —
# recast.damage, returnDamage, burst, bolts.damage) base: [..] is per rank; ad / ap / hpRatio may be a number or a per-rank list;
# cooldown: [..] and cost: [..] per rank. Every other number is a scalar. rmb = the kit's second spell (ylva: rmb = Amber Draw, q = Shale Fan).
# ad: ratios apply to TOTAL ad; bonusAd: applies to bonus AD only (total minus the kit's stats+growth line), the genre's bonus ratios.
# ---- what the bots read against a wave (scripts/lib/bot-siege.js) ----
# clear: on a slot, is it cast at a minion wave. With no field its type decides: a damaging circle, cone, piercing line or bouncing bolt
#   clears; an ultimate, a dash, a blink, a hook and a champions-only shot never do. `clear: true` adds a slot the type does not show
#   (its damage sits in a burst, a bomb, a chain); `clear: false` keeps one out (a shield that also bursts). On the CHAMPION,
#   `clear: false`: its own bot module casts its spells at a wave, the generic rule keeps out.
# lastHit: true on a slot: a single shot the bot spends on a minion its basic attack cannot take in time.
# ---- the bots' hands (scripts/lib/bot-kit.js explains each) ---- bot knowledge only: lib/abilities.js reads none of these.
# Each field is read by one rule of the bot's tier (lib/data/difficulty.yml); with the rule off the field is not read.
# On a champion: combo: [slot, …] = the order its hands press in under the comboOrder rule; the comboSkill rule reads from it which
# step sets up which, and a shield left out of it is the guardSkill rule's to keep; owner: module = a champion module
# (lib/bot-<champ>.js) plays it (under the moduleOwns rule the generic hands press none of its slots).
# On a slot: after: held | hit (the step waits for the target to be held / for the step before it to land) ·
# when: { field, "on": self | target, min, by } (it waits for a mark or passive that slot `by` lays) · recast.when: landed | charged |
# safe | spaced | toAllies | hold | passed | huddle (when the second press pays; share / gap tune it; huddle: a shot with `pulse` is burst over two allied heroes or one being struck) · mobility: escape | engage | both (a blink or
# dash kept for the escape; forward with the kill, or the follow-up) · on R's row, ult: { use: execute | area | held | snipe | peel,
# hp, n, r, line, own, most, dying } (own: never under this share of the caster's own health · most: never with more enemy heroes than this in its shape · dying: an ultimate thrown for allies also answers an allied hero within r, or its caster, under this share of health who is losing health now, whoever strikes and in a fight or out of one: lib/bot-kit.js kitSave) (what a full bar waits for; with no row R is pressed as any slot; the hero's own `ult: { cost }` is the bar's
# price, not this) · useAt: attack | far · cc: { kind, away } (away: false brings the enemy TO the caster) ·
# guard: self | ally | both (a shield, pressed on incoming damage) · displace: { dir: away | toMe | aim | out, dist }.
# ---- what only the bots read (no cast, no hit and no screen reads these two) ----
# botTell: how a slot's own piece shows itself to a bot's eyes and aim (scripts/lib/bot-dodge.js, lib/bot-aim.js), on slots whose
#   piece is not a generic missile / zone / line of scripts/projectile.js: { shape: line | circle | ring | cone | lock, kind (what a
#   tier's eyes know it as: hook, windup …; default the shape), tag (the piece's tag when it is not a projectile row), piece (its
#   state.mode / state.kind), state (where the cast lives on the CASTER's state), at (s from the press until it leaves, when castTime +
#   windup + delay do not say it), speed (m/s of a front the row has no speed for), seen (s before an enemy can see it), stay (s it
#   keeps landing), hold (s of control the effects list does not carry), worth (a floor on its danger), w (m wide), blow (the key on
#   the slot of the row this piece's damage and effects are, when the piece is not the slot's own blow: a hedge a shot leaves) }.
# shape: the aim's shape when the type does not say it: ring = aimed so the target stands in the band between inner and radius.
# ---- flags a row switches on (scripts/lib/kit-flags.js, lib/hedge.js, lib/brush.js; the cast, the hit and the pieces read them) ----
# leaveLantern: { life } with an effect { kind: charm, to: lantern } (the charmed walks to a lantern left at the cast; a row's `lantern` is Mordrake's
#   thrown one, another rule) · recall: { after, leaves } (a shot that returns is called home by a second press; leaves: s, the caster's lantern is set down where it turned; the bots: recast: { when: passed }) · passive.watch: { radius, speed, bolts, on, ring } (the caster's ONE standing lantern answers a cast of a slot in `on` with a mote of the passive row's own damage, and a landed dash's bolts fly from it too: lib/kit-flags.js) ·
#   pulse: { radius, after } (a shot that returns BURSTS where it flies at a second press, out or on its way home: every ally within `radius` of it takes the row's `effects`, and the shot is spent; Lysara's Wandering Star) ·
#   bolts: { cone } (a dash's bolts only inside a cone along its aim, from where the dash began) ·
#   rime: { slow: [..], window, duration } (hits on one target build the slow; window is longer than the hero's slowest gap between two hits) · stones: { count, by, ring } with a sub-row `stone` (a self boost carried by stones round the caster: each cast of slot `by`
#   sends one with the shot, a shot of its own by the sub-row, and the stone takes its share of the boost with it) ·
#   ramp: { from, over } (a shot that gathers speed: it leaves at `from` of the row's speed and has all of it `over` s on) · castShake (the ground
#   shakes at the cast for whoever stands near) · endArea.frost.damage and .core { radius, mult } (a landed scout's strike deals damage, more at its heart) · pierceGain: { per, max } (a piercing shot, harder for each body passed) · brush: team (an area that is brush for its caster's team) ·
#   hedge: { length, width, rise, duration, effects } (a shot that strikes a champion raises a line across its path; who touches it takes the effects once).
# story: two sentences about the hero, shown with its name (the menu's kit bar, the phone's kit sheet).
aldric:
  name: Aldric
  title: The Oathsworn
  story: "First knight of the Oathsworn, who swore at the mesa's edge that no ally of his would fall alone. The blue cloth on his back is his house's last banner, and where he plants its light the line holds."
  combo: [q, e, r] # the pin, the sweep on the pinned, the finisher last; Hold the Line is a guard for him and the ally beside him
  class: fighter
  role: bruiser
  ult: { cost: 1100 }
  weapon: greatsword
  resource: none
  color: [0.8, 1.4, 1.8] # the cyan-white light of the gem in his sword's ring guard (his hue on the HUD, a blow's number)
  stats: { hp: 720, mana: 0, ad: 69, ap: 0, armor: 40, mr: 32, moveSpeed: 6.8, attackSpeed: 0.625, hpRegen: 8, manaRegen: 0 }
  growth: { hp: 104, ad: 4.5, armor: 4.4, mr: 1.55, attackSpeed: 0.0365, hpRegen: 0.5 }
  lmb: { name: Oathblade, type: melee, range: 3.6, angle: 120, combo: 3, hitFrame: 0.35, damage: { ad: 1 }, clip: attack, desc: "Three greatsword cuts in a chain. The third is a wide cleave for 40% more." }
  rmb: { name: Hold the Line, type: self, guard: both, allyRange: 8, share: { radius: 8, ratio: 0.5 }, cooldown: [23, 21, 19, 17, 15], cost: 0, clip: cast, self: [{ kind: shield, base: [65, 85, 105, 125, 145], hpRatio: 0.07, duration: 4 }], short: "A shield for 4 s. The nearest ally gets half of it.", desc: "Braces behind a shield of 65/85/105/125/145 (+7% max HP) for 4 s. The nearest allied hero within 8 m gets a shield of 50% of that." }
  q: { name: Marching Order, type: melee, heavy: true, single: true, range: 4, angle: 90, cc: { kind: pin, away: true }, pin: { duration: 1.5 }, cooldown: 8, cost: 0, damage: { base: [30, 60, 90, 120, 150], ad: 0.5 }, self: [{ kind: speed, amount: 0.35, duration: 1.5 }], clip: q, short: "A burst of speed and a heavy blow that pins: no roll and no sprint for 1.5 s.", desc: "Runs 35% faster for 1.5 s and strikes. The enemy hero it hits is PINNED for 1.5 s: it cannot roll and cannot sprint." }
  e: { name: Banner Sweep, type: area, at: self, follow: true, radius: 4.5, duration: 3, tick: 0.5, sweep: { front: 1.25, back: 0.5 }, damage: { base: [10, 15, 20, 25, 30], ad: 0.45 }, tickDamage: { base: [10, 15, 20, 25, 30], ad: 0.45 }, cooldown: [14, 13, 12, 11, 10], cost: 0, clip: e, short: "Sweeps the greatsword for 3 s; enemies in front of you take 25% more.", desc: "Sweeps the greatsword around him for 3 s while he walks, the banner's cloth streaming after the blade: a cut every 0.5 s. Enemies in front of him (the half toward your crosshair) take 125% of each cut; enemies behind him take 50%." }
  r: { name: Last Oath, type: melee, single: true, range: 9, angle: 40, windup: 0.4, fxRide: true, missingHp: 0.3, ult: { use: execute }, banner: { duration: 4, radius: 8, shield: { base: [90, 150, 210], hpRatio: 0.05, duration: 4 } }, damage: { base: [150, 250, 350], type: true }, cost: 0, clip: r, short: "A finishing blow of true damage. It plants his banner: allies within 8 m gain a shield.", desc: "A finishing blow: true damage that grows with the target's missing health. Where it lands he plants his banner for 4 s: Aldric and every allied hero who stands within 8 m of it gains a shield of 90/150/210 (+5% of his max HP)." }
varkas:
  name: Varkas
  title: The Red Reaver
  story: "Varkas leads the reaver host of the ember lowlands. From every soldier he cuts down he takes one iron tag; they hang from him by the hundred and sing when he walks. Hear them: the reaping has begun."
  combo: [e, rmb, q, r] # the leash's pull, the hamstring, the Reaping Arc from its edge, Final Tally when it kills
  class: juggernaut
  role: bruiser
  ult: { cost: 1300 }
  weapon: reaping axe
  resource: mana
  color: [2.0, 0.66, 0.16]
  stats: { hp: 652, mana: 263, ad: 64, ap: 0, armor: 37, mr: 32, moveSpeed: 6.8, attackSpeed: 0.625, hpRegen: 10, manaRegen: 6.6 }
  growth: { hp: 114, mana: 58, ad: 5, armor: 5.2, mr: 2.05, attackSpeed: 0.01, hpRegen: 0.95, manaRegen: 0.35 }
  passive: { name: Iron Tally, bleed: { dps: 5, perLevel: 0.2, bonusAd: 0.06, duration: 5 }, desc: "His axe hangs an iron tag on what it cuts: a Tally, a bleed that stacks 5 times (5 +0.2 per level +6% bonus AD each second, for 5 s). Final Tally hits 20% harder for each tag on its victim." } # bleed: the one row of the Tally's numbers; every { kind: bleed } his hits carry is one more mark of it (lib/varkas.js tallyOf)
  lmb: { name: "Reaver's Axe", type: melee, range: 3.8, angle: 100, damage: { ad: 1 }, effects: [{ kind: bleed }], clip: attack, desc: "Heavy strikes of the reaping axe; each one hangs a Tally tag, a stacking bleed." }
  rmb: { name: Hamstring, type: melee, single: true, range: 4, angle: 80, cc: { kind: slow, away: true }, cooldown: [7, 6.5, 6, 5.5, 5], cost: 30, damage: { ad: [1.4, 1.45, 1.5, 1.55, 1.6] }, effects: [{ kind: slow, amount: 0.9, duration: 1 }, { kind: bleed }], clip: attack3, desc: "A low cut that nearly stops its target for 1 s and hangs a Tally tag." }
  q: { name: Reaping Arc, type: area, at: self, arc: 180, radius: 8.5, delay: 0.75, fxTail: 1.2, botTell: { shape: circle, tag: varkas-arc }, damage: { base: [50, 80, 110, 140, 170], ad: [1.0, 1.1, 1.2, 1.3, 1.4] }, inner: { radius: 3.8, mult: 0.35 }, outerHeal: 0.12, effects: [{ kind: bleed }], cooldown: [9, 8, 7, 6, 5], cost: [25, 30, 35, 40, 45], clip: q, desc: "Swings the axe through the half circle in front of him, 8.5 m out, toward your aim. The blade's edge bites hard and heals him for each hero it meets; inside 3.8 m only the haft lands, for 35%." }
  e: { name: Iron Leash, type: cone, castTime: 0.25, range: 8, angle: 50, cc: { kind: pull, away: false }, displace: { dir: toMe, dist: 5.5 }, chained: { duration: 2, range: 8, yank: 3 }, cooldown: [24, 21, 18, 15, 12], cost: 45, damage: { base: 0 }, effects: [{ kind: pull, distance: 5.5 }, { kind: slow, amount: 0.4, duration: 1 }], clip: e, desc: "Hooks everything in front of him and drags it in. The nearest hero stays on his chain for 2 s: more than 8 m from him, the chain pulls that hero back 3 m and breaks." }
  r: { name: Final Tally, type: melee, targeted: true, heavy: true, single: true, range: 7, lockSlack: 1, lockAngle: 60, windup: 0.35, drag: { fall: 0.3, stop: 1.8, reach: 4, slack: 4 }, bonusPerBleed: 0.2, resetOnKill: true, ult: { use: execute }, botTell: { shape: lock, tag: varkas-due }, damage: { base: [125, 250, 375], ad: 0.75, type: true }, cost: [100, 100, 0], clip: r, desc: "Marks the hero under your crosshair (7 m), drags them to his feet, then the axe falls: true damage, 20% more for each Tally tag on them. A kill gives the whole ultimate back. No hero in reach, no cast." }
solvar:
  name: Solvar
  title: The Blazing Oath
  story: "When the Dawn Throne sealed its gates against the dark, one knight rode out before the bolts fell: Solvar, sworn to carry the first light of the sun wherever the night had gone deepest. His crest burns at the hour of dawn whether he wills it or not, and every enemy on the mesa has learned to fear the morning."
  combo: [e, q, rmb, r] # the burning line (it ties one hero to the spot), the bash, the dawn shield, Daybreak on two
  rider: scripts/solvar-oath.js # the tell of his passive: his crest burns while Oathlight is ready (scripts/champion.js spawns a hero's rider)
  passive: { name: Oathlight, ward: { base: 25, perLevel: 5, hpRatio: 0.03, duration: 2.5 }, radius: 9, cooldown: 10, short: "Stun an enemy hero near him: he and allies within 9 m are shielded 2.5 s. Once every 10 s.", desc: "His oath answers his blows. When Solvar stuns an enemy hero within 9 m of him, he and every allied hero within 9 m are warded by the sun for 2.5 s: a shield of 25 (+5 per level) +3% of his max health. Once every 10 s. His crest burns while it is ready." } # ward: the one row of the shield's numbers (lib/solvar.js oath)
  class: tank
  role: tank
  ult: { cost: 950 }
  weapon: sword and sun shield
  resource: mana
  color: [1.9, 1.35, 0.4]
  stats: { hp: 700, mana: 302, ad: 58, ap: 0, armor: 46, mr: 34, moveSpeed: 6.7, attackSpeed: 0.625, hpRegen: 8.5, manaRegen: 6 }
  growth: { hp: 110, mana: 40, ad: 3, armor: 5, mr: 2.05, attackSpeed: 0.029, hpRegen: 0.85, manaRegen: 0.8 }
  lmb: { name: Dawn Edge, type: melee, range: 3.4, angle: 100, damage: { ad: 1 }, clip: attack, desc: "Cuts with the burning flamberge from behind the sun shield." }
  rmb: { name: Gathering Dawn, type: area, clear: false, at: self, follow: true, radius: 4.5, delay: 3, guard: self, breakBurst: true, shield: { base: [60, 85, 110, 135, 160], hpRatio: 0.06, duration: 3 }, damage: { base: [55, 90, 125, 160, 195], ap: 0.4, type: magic }, cooldown: [14, 13, 12, 11, 10], cost: 60, fxRide: true, clip: cast, short: "A shield for 3 s. It bursts in sunfire when it is broken, or after 3 s.", desc: "Raises a shield of 60/85/110/135/160 (+6% max HP) for 3 s. The moment the shield is broken it bursts in sunfire around him; a shield nobody breaks bursts after 3 s. The enemy chooses when." }
  q: { name: "Throne's Rebuke", type: melee, heavy: true, single: true, range: 6.5, angle: 90, rush: { range: 6, speed: 24, reach: 1.25, strike: 3 }, mobility: engage, cc: { kind: stun, away: true }, cooldown: [12, 11, 10, 9, 8], cost: [35, 40, 45, 50, 55], damage: { base: [10, 35, 60, 85, 110], ap: 0.2, type: magic }, effects: [{ kind: stun, duration: 1 }], fxRide: true, clip: q, short: "Charges 6 m behind the sun shield and bashes the first enemy hero in his way: a 1 s stun.", desc: "Charges up to 6 m behind the sun shield, along his aim. The first enemy hero in his way stops him and takes the bash: a 1 s stun. A charge that meets no hero ends in a bash at whatever stands in front of him. Rooted, he bashes where he stands." }
  e: { name: Dawnline, type: skillshot, clear: false, castTime: 0.2, range: 18, speed: 42, width: 1.4, pierce: 99, blade: true, line: { duration: 3, leash: 7, side: 3, stand: 0.6, burst: { base: [40, 70, 100, 130, 160], ap: 0.3, type: magic }, slow: { amount: 0.4, duration: 1.5 } }, cc: { kind: stun, away: true }, damage: { base: [50, 90, 130, 170, 210], ap: 0.4, type: magic }, effects: [{ kind: stun, duration: 0.5 }], cooldown: [12, 10.5, 9, 7.5, 6], cost: 60, fxRide: true, clip: e, short: "Ties the first hero it hits to a blade for 3 s. Leave its 7 m ring: a burst and a slow.", desc: "Hurls a blade of sunfire through minions. It stops at the first enemy hero it hits, stuns them 0.5 s and stands in the ground beside them: a burning line ties them to it for 3 s, and a ring of gold on the ground shows its 7 m reach. A hero who leaves the ring before the line burns out snaps it: 40/70/100/130/160 (+30% AP) magic damage and a 40% slow for 1.5 s. A hero who stays is not harmed. The enemy chooses." }
  r: { name: Daybreak, type: area, heavy: true, at: aim, range: 26, radius: 6, delay: 0.65, ult: { use: area, n: 2 }, cc: { kind: stun, away: true }, lit: { duration: 4 }, fxTail: 1.9, damage: { base: [90, 155, 220], ap: 0.7, type: magic }, effects: [{ kind: slow, amount: 0.8, duration: 1.75 }], inner: { radius: 3, mult: 1, effects: [{ kind: stun, duration: 1.25 }] }, second: { delay: 1.2, radius: 5, mult: 0.5, effects: [{ kind: slow, amount: 0.4, duration: 1.25 }] }, cost: 100, fxRide: true, clip: r, short: "The sun falls twice: where he aims (heart stuns, rim slows), then on Solvar himself.", desc: "Calls down a column of the sun where he aims: the heart stuns 1.25 s, the rim slows 80%. 1.2 s after it lands a second, smaller sun falls on Solvar himself, wherever he stands by then: half the damage and a 40% slow for every enemy within 5 m of him. Every enemy hero either sun hits is LIT for 4 s: brush does not hide them and they show on your team's map." }
tenzo:
  name: Tenzo
  title: The Sightless Storm
  story: "He hears a heartbeat through stone, and has needed no eyes since the cliff monasteries taught him to listen. When the mesa began to shake he left their silence, and the storm he carries came with him."
  combo: [q, e, r] # the wave (its flight to the target only when safe), the slam, the grip thrown toward our team; Sheltering Step is the way out
  class: fighter
  role: bruiser
  ult: { cost: 800 }
  weapon: bare hands
  resource: energy
  color: [0.75, 1.5, 2.6] # white-blue lightning: his shield's shell, the gather at his palm, the throw's line
  rider: scripts/tenzo-rider.js # what his own body shows of his shield's rules, for as long as the body is his (scripts/champion.js spawns a hero's rider): the storm on his fists while a shield stands on him, the shell of a shield his strikes have added to, the band that climbs him at each gain
  passive: { name: Storm Within, bolt: { base: 6, perLevel: 1.5, ad: 0.08, type: magic }, short: "While a shield is on him, each of his strikes also strikes with lightning.", desc: "While any shield stands on Tenzo, each of his basic attacks calls a spark of lightning onto what it strikes: 6 (+1.5 per level) +8% AD magic damage. His own Sheltering Step opens it, Stormguard keeps it open strike after strike, and a shield an ally or a piece of gear gives him opens it too. Break his shield and the storm is shut in again." } # bolt: the lightning's damage (lib/abilities.js amountOf: base + perLevel a level past the first + ad x his attack damage), dealt as the passive's own blow by lib/tenzo.js tenzoHit; the shield is read as it stood before the strike
  stats: { hp: 645, mana: 200, ad: 69, ap: 0, armor: 36, mr: 32, moveSpeed: 6.9, attackSpeed: 0.651, hpRegen: 7.5, manaRegen: 10 }
  growth: { hp: 108, mana: 0, ad: 3.7, armor: 4.9, mr: 2.05, attackSpeed: 0.03, hpRegen: 0.7 }
  lmb: { name: Open Palm, type: melee, range: 3.2, angle: 90, combo: 3, step: 1.4, gaps: [0.65, 0.65, 1.1], hitFrame: 0.3, damage: { ad: 0.85 }, clip: attack, desc: "A chain of three fast open-hand strikes: two quick palms and a heavier third (+40%), then a breath. Each strike carries him one short step toward your crosshair and plants him as it lands: he never walks through what he strikes." } # step: the attack step (lib/step-rules.js): the swing is played whole, carries him up to 1.4 m down the swing's line (never into an enemy body) and stands him from the blow on, and between two swings while the attack is held. gaps: the share of his attack interval that follows each blow of the chain (lib/abilities.js castCore): three blows take 2.4 intervals where they took 3 (a quarter more strikes a second), paid by each strike's damage (85% AD where it was 100%). hitFrame: the palm lands 30% into its swing (it was 35%)
  rmb: { name: Sheltering Step, type: dash, range: 8, allyRange: 14, speed: 30, mobility: escape, guard: ally, cooldown: 12, cost: 50, self: [{ kind: shield, base: [55, 100, 145, 190, 235], ap: 0.8, duration: 2 }], toAlly: true, stormguard: { window: 3, duration: 4, share: [0.25, 0.3, 0.35, 0.4, 0.45], cap: [80, 120, 160, 200, 240], hold: 2.5 }, clip: dash, short: "Leaps to an ally (or forward) and shields himself and them. Press again within 3 s: for 4 s each of his strikes adds to his shield.", desc: "Leaps to the ally under your reticle (or forward): shields himself and them. Press again within 3 s: Stormguard. For 4 s each of his basic attacks adds a shield worth 25/30/35/40/45% of the damage it deals, up to 80/120/160/200/240 of it at once; it stands 2.5 s after his last strike." } # stormguard: the second press (the owners, 2026-10-03: "instead of life stealing on his reactivation [...] each auto attack adds more shield to him. For a percentage of the damage that he deals"): share of a basic attack's dealt damage, by rank; cap: the most of this shield he wears at once; hold: seconds it stands after the last gain. It took the place of vamp (lifesteal 5 to 25% on every hit for 4 s): lib/tenzo.js tenzoGuard, tenzoHit
