  passive: { name: Kindle, hero: 1, other: 0.5, bank: 1.5, short: "Each bolt that hits takes 1 s off Mending Light (0.5 s on a minion), or banks up to 1.5 s.", desc: "Ansel's light is kindled by the fight. Each Morning Bolt that strikes an enemy hero takes 1 s off Mending Light's cooldown; a bolt on a minion or a monster takes 0.5 s. While Mending Light is ready the same bolts bank embers instead, up to 1.5 s (the three pips on this slot and by your crosshair): your next Mending Light starts its cooldown that much shorter. Keep firing and the heal comes back in half the time." }
  lmb: { short: "A bolt of light. Each one that strikes brings Mending Light back sooner.", name: Morning Bolt, type: projectile, range: 16, speed: 32, width: 0.6, damage: { ad: 1 }, clip: attack, desc: "A bolt of first light. Kindle: each bolt that strikes an enemy hero takes 1 s off Mending Light's cooldown (0.5 s on anything else)." }
  rmb: { short: "Swing your censer out and back. Out it burns, home it heals: you too, if it hit a hero.", name: Thurible, type: skillshot, pierce: 99, clear: false, range: 10, speed: 24, width: 2.4, cc: { kind: slow, away: true }, censer: { back: 28, strike: 1.6, heal: { base: [45, 60, 75, 90, 105], ap: 0.25 }, lit: 1.5, self: 2 }, damage: { base: [50, 75, 100, 125, 150], ap: 0.3, type: magic }, effects: [{ kind: slow, amount: 0.2, duration: 1 }], cooldown: [10, 9.5, 9, 8.5, 8], cost: 55, clip: rmb, desc: "Ansel swings his censer out on its chain: 10 m along his aim, then home to his hand. On its way out it deals 50/75/100/125/150 (+30% AP) magic damage to every enemy it passes and slows them 20% for 1 s. On its way home it heals every allied hero it passes for 45/60/75/90/105 (+25% AP). A censer that struck an enemy hero comes home LIT: it heals 50% more, and when Ansel catches it it heals him for twice that (it is the one way he mends himself, and he must stand within its reach of an enemy hero to do it). Stand where your friends and your enemy are on one line. Dived? Swing it through the diver: it comes home lit and mends you as you catch it." }
  q: { short: "Throw a heal down your aim: more on the badly hurt, and 40% to allies within 3 m. An enemy hero blocks it.", name: Mending Light, type: skillshot, assist: ally, allies: true, guard: ally, guardHurt: 0.7, clear: false, range: 24, speed: 36, width: 2, mend: { heal: { base: [70, 95, 120, 145, 170], ap: 0.4 }, low: 0.4, lowMult: 1.3, refund: 0, chain: 0, splash: { radius: 3, share: 0.4 }, block: { base: [30, 40, 50, 60, 70], ap: 0.2, type: magic } }, cooldown: [8, 7.5, 7, 6.5, 6], cost: [45, 50, 55, 60, 65], clip: q, desc: "A shaft of light flies 24 m along your aim and heals the first hurt allied hero it meets for 70/95/120/145/170 (+40% AP), and 30% more if that hero is under 40% of their health. Every other allied hero within 3 m of where it lands is healed for 40% of that. It passes minions and allies at full health. The first enemy hero in its way blocks it and takes 30/40/50/60/70 magic damage (a blocked light heals no one). A wall stops it. It cannot heal Ansel, not even by its splash. Kindle: every Morning Bolt that strikes brings it back sooner." }
  e: { short: "Throw enemies before you back 5 m and slow them 40% for 2 s. You run 30% faster for 1.5 s.", name: Forbid, type: cone, clear: false, range: 7, angle: 70, cc: { kind: knockback, away: true }, displace: { dir: away, dist: 5 }, damage: { base: [40, 60, 80, 100, 120], ap: 0.3, type: magic }, effects: [{ kind: knockback, distance: 5 }, { kind: slow, amount: 0.4, duration: 2 }], self: [{ kind: speed, amount: 0.3, duration: 1.5 }], cooldown: [16, 15, 14, 13, 12], cost: 60, clip: e, desc: "Ansel forbids the way: a wall of light goes out from him, and every enemy in a 7 m cone in front of him takes 40/60/80/100/120 (+30% AP) magic damage, is thrown back 5 m and slowed 40% for 2 s. The way he forbade is his: Ansel runs 30% faster for 1.5 s. It is his one answer to a hero who dives him, and it is down for a long time after: shove, step away, and swing the Thurible through them as they come." }
  r: { short: "After 0.9 s a wave of light heals allies in a wide fan, you too, and burns enemies.", name: First Light, type: cone, assist: ally, allies: true, heavy: true, clear: false, fxRide: true, range: 20, angle: 60, delay: 0.9, rise: { speed: 40, rays: 5, low: 0.4, heal: { base: [260, 400, 540], ap: 0.6 }, shield: { base: [0, 0, 0], ap: 0 } }, damage: { base: [90, 140, 190], ap: 0.3, type: magic }, effects: [], ult: { use: peel, hp: 0.45, r: 14, dying: 0.2 }, cost: 100, clip: r, desc: "Ansel raises his staff, and the rays of a rising sun show on the ground in front of him for both teams: a fan 20 m long. After 0.9 s first light runs out along it: every allied hero it reaches, Ansel too, is healed 260/400/540 (+60% AP), and every enemy takes 90/140/190 (+30% AP) magic damage. A stun, a knock-up, a charm or a silence on Ansel before it rises stops it, and half his bar comes back." }
# ---- Ysolde, the Hourglass Sage (remade 2026-10-04; scripts/lib/ysolde.js, scripts/ysolde-piece.js, scripts/ysolde-rider.js) ----
# THE RHYTHM: she sets a clock and chooses the moment it turns: mark, fight, turn. A second press of the same button turns its clock now.
# passive: grains (how many her staff's glass keeps), hold (s they stay after her last dart on an enemy hero), per (the share each
#   grain adds to what a clock gives when it turns: the turn takes them all).
# q.mark: a skillshot at a HERO (the first it meets, ally or enemy; with none in its path it lies on her). time: s the clock runs ·
#   share, cap: an ALLY gets back that share of the health lost since the mark, up to cap · glass: the thin shield the ally wears
#   while marked (what is left of it when the clock turns becomes health) · foe: { share, cap, slow, secs } an ENEMY takes again that share
#   of the health lost since the mark and is slowed · after: s after it lands before a second press may turn it · self: it may lie on her
#   (at once with the self-cast key; a thrown glass that met no hero breaks at the end of its flight and its mark then falls on her).
#   refund: s of the mark's cooldown that come back when SHE presses the turn and it pays (health lost under the mark given back, or
#   an enemy's hour repeated): never for a turn by its own clock, a miss, or a mark nobody struck · mend: { share, secs } a mark on an
#   ALLY that turns having given less than that share of its cap leaves the rest of that share as a slow mend, a part each second
#   for secs (the piece lives on for it: a mark on a wound that already stands is a real heal, and a timed turn is worth twice it).
# rmb.sand: the ground turns to sand for duration s after delay s. slow: [from, to] the slow grows as the clock drains (laid again each
#   `pace` s) · tick, tickDamage: the burn, once a tick · set: when it has drained every enemy still in it takes the damage and is
#   rooted `root` s; a second press sets it early for a root of rootMin..root by the share that had drained.
# e.anchor: the first press stands her hour where she is for `time` s; the second returns her to it. back, cap: the share of the
#   health she lost since that comes back · leave: { radius, slow, secs } the sand left where she left from · after: s before the return opens.
# r.dial: every allied hero in the radius, herself too, is marked `time` s (share, cap, brink: a mark of the Glass turns by itself
#   under that share of the health its hero had when marked) · back: the seconds BEFORE the cast whose lost health also counts as lost
#   under the mark (the window itself is lib/lost-lately.js LOST_MS: the save reaches a wound that already stands) · after: s before
#   her press may turn it · drag: { slow, secs } enemies standing on the dial when it turns.
# recast.when: due = the bots press the second press when the clock's own piece says it is due (lib/ysolde.js dueNow; lib/bot-kit.js).
ysolde:
  name: Ysolde
  title: the Hourglass Sage
  story: "The Conclave keeps one glass that was never turned, and Ysolde is the only sage it lets near it. She does not stop a wound: she sets a clock on it, and at the moment she chooses she takes the hour back."
  combo: [rmb, q, r] # the sand under the fight, the mark on whoever is in it; the mark and her own step back are also guards
  class: enchanter
  role: healer
  ult: { cost: 800 }
  rider: scripts/ysolde-rider.js
  shieldFx: scripts/fx/ysolde-glass.fx.js
  weapon: "a tall dark-bronze staff whose armillary cage holds an hourglass of lit sand (2H staff clips)"
  resource: mana
  color: [0.25, 1.9, 2.1]
  stats: { hp: 550, mana: 400, ad: 47, ap: 0, armor: 25, mr: 30, moveSpeed: 6.6, attackSpeed: 0.64, hpRegen: 5.5, manaRegen: 11.5 }
  growth: { hp: 86, mana: 48, ad: 2.5, armor: 4.3, mr: 1.3, attackSpeed: 0.022, hpRegen: 0.55, manaRegen: 0.5 }
  passive: { short: "Sand Darts that hit enemy heroes keep grains (up to 4). A clock that turns takes them: each makes it 10% stronger.", name: Kept Time, grains: 4, hold: 6, per: 0.1, desc: "Each Sand Dart that strikes an enemy hero keeps a grain of sand in her staff's glass, up to 4; they run out 6 s after her last hit. When one of her clocks turns (Mark the Hour, Last Grain, Turn Back, The Unturned Glass) it takes every grain she holds, and each makes what the clock gives 10% larger. Mark, shoot, then turn." }
  lmb: { short: "Throw a dart of sand at the enemy under your crosshair. On an enemy hero it keeps a grain.", name: Sand Dart, type: projectile, range: 16, speed: 34, width: 0.6, damage: { ad: 1 }, clip: attack, desc: "A dart of bright sand. It is weak, but each one that strikes an enemy hero keeps a grain for her next clock (Kept Time)." }
  rmb: { short: "Turn a 5 m circle to sand for 3 s. Enemies in it slow more and more; when the last grain falls, those still in it are rooted. Press again to set it early.", name: Last Grain, type: area, at: aim, clear: false, range: 20, radius: 5, delay: 0.5, duration: 3, tick: 1, cc: { kind: root, away: true }, botTell: { shape: circle, tag: ysolde-piece, piece: sand, stay: 3, hold: 1, at: 0.5 }, sand: { slow: [0.2, 0.5], pace: 0.5, root: 1, rootMin: 0.4, after: 0.5, set: { base: [50, 75, 100, 125, 150], ap: 0.4, type: magic } }, tickDamage: { base: [16, 24, 32, 40, 48], ap: 0.12, type: magic }, recast: { when: due }, cooldown: [16, 15, 14, 13, 12], cost: [70, 75, 80, 85, 90], clip: e, desc: "After 0.5 s a 5 m circle at your aim turns to sand for 3 s, and a dial round it drains for both teams to read. Enemies in it are slowed 20%, rising to 50% as it drains, and take 16/24/32/40/48 (+12% AP) magic damage each second. When the last grain falls the sand sets: every enemy still inside takes 50/75/100/125/150 (+40% AP) and is rooted 1 s. Press again to set it at once: the root is shorter the less of the dial had drained (0.4 s at the least)." }
  q: { short: "Throw a mark at a hero. An ally gets back 60% of the health lost in the next 4 s; an enemy takes 25% of it again. Press again to turn it: a turn that pays returns 3 s.", name: Mark the Hour, type: skillshot, assist: ally, allies: true, guard: both, clear: false, range: 22, speed: 32, width: 2, mark: { time: 4, share: 0.6, cap: { base: [130, 180, 230, 280, 330], ap: 0.7 }, glass: { base: [30, 45, 60, 75, 90], ap: 0.2 }, self: true, after: 0.4, refund: 3, mend: { share: 0.5, secs: 4 }, foe: { share: 0.25, cap: { base: [60, 90, 120, 150, 180], ap: 0.35, type: magic }, slow: 0.3, secs: 1.5 } }, recast: { when: due }, cooldown: [12, 11.5, 11, 10.5, 10], cost: [60, 65, 70, 75, 80], clip: q, desc: "A glass of sand flies 22 m along your aim and marks the first hero it meets for 4 s: a clock at their feet that both teams read. An ALLY wears a thin glass (a 30/45/60/75/90 (+20% AP) shield) while marked; when the clock turns they get back 60% of the health lost since the mark, up to 130/180/230/280/330 (+70% AP), and what is left of the thin glass as health. An ENEMY, when the clock turns, takes again 25% of the health lost since the mark (up to 60/90/120/150/180 (+35% AP) magic damage) and is slowed 30% for 1.5 s. Press Q again to turn the clock now; it turns by itself when its time is up. A turn you press that gives health back (or repeats an enemy's hour) returns 3 s of this cooldown. If the turn gave an ally less than half of what it could, the rest of that half runs back into them over 4 s. A hero who dies under it gets nothing. A wall stops it. A glass that meets no hero breaks at the end of its flight, and its mark then falls on Ysolde herself." }
  e: { short: "Stand your hour where you are and run 30% faster for 1.5 s. Press again within 4 s to return to it, with half the health you lost since.", name: Turn Back, type: self, clear: false, guard: self, anchor: { time: 4, back: 0.5, cap: { base: [80, 120, 160, 200, 240], ap: 0.4 }, after: 0.4, leave: { radius: 3.5, slow: 0.4, secs: 1.25 } }, self: [{ kind: speed, amount: 0.3, duration: 1.5 }], recast: { when: due }, cooldown: [18, 17, 16, 15, 14], cost: 70, clip: cast, desc: "Ysolde stands a small hourglass where she is, for 4 s, in plain sight of both teams, and runs 30% faster for 1.5 s. Press E again to return to it at once: she gets back 50% of the health she lost since (up to 80/120/160/200/240 (+40% AP)), and the sand she leaves behind slows enemies within 3.5 m of where she left by 40% for 1.25 s. A root, a stun or a silence stops the return." }
  r: { short: "Mark every allied hero within 12 m, yourself too. When the Glass turns, each gets back 80% of the health lost since, and in the 3 s before it. Press again to turn it now.", name: The Unturned Glass, type: area, at: self, radius: 12, allies: true, heavy: true, clear: false, dial: { time: 3, share: 0.8, cap: { base: [400, 600, 800], ap: 1.0 }, brink: 0.3, back: 3, after: 0.7, drag: { slow: 0.4, secs: 1.5 } }, recast: { when: due }, ult: { use: peel, hp: 0.5, r: 8 }, cost: 100, clip: r, desc: "Ysolde stops the sand: her great glass hangs over a dial where she stands, and every allied hero within 12 m, herself too, is marked for 3 s. When the Glass turns each gets back 80% of the health they lost since the cast and in the 3 s before it, up to 400/600/800 (+100% AP), and every enemy standing on the dial is slowed 40% for 1.5 s. Press R again to turn it now (it opens 0.7 s after the cast). A mark of the Glass also turns by itself if its hero falls under 30% of the health they had when marked. A hero who dies before the Glass turns gets nothing: kill one of them fast, or stop her press." }
# ---- Veyran, The Sigilblade (born in League of Spawn, 2026-10-03; scripts/lib/veyran.js, scripts/veyran-piece.js) ----
# passive: rings (how many sigil rings his blade holds), hold (s the lit rings stay lit after the last basic hit) · lmb.overhead: the rings
#   the chain's third blow lights (the others light one) · q.when: the bots hold the cleave for three lit rings (lib/bot-kit.js). With every ring lit
#   his next Q, RMB or E is INSCRIBED: it spends the rings and adds its row's `inscribed` block. passive.spell: rings a spell that
#   strikes lights (once a cast) · passive.waste: a cast on fewer than `rings` takes them and gains nothing · passive.amp: how much
#   harder every blow of an inscribed spell strikes. The rhythm they make: a spell, two swings, a spell.
# q.inscribed: { linger, inner, slow, damage } the crescent from inner m (inside his sword's reach) to the row's range burns on the ground
#   for linger s, slows who stands on it by slow, then bursts for damage on every enemy that stands on it · rmb.leap: { base, per } the leap's airtime: base s + per s a metre ·
#   rmb.inscribed: { duration, radius, slow, grip } the scar slows enemies that stand in it, and the slam slows whoever it strikes for grip s · e.reach: how far past where he reappears the
#   thrust's tip bites, e.width: the line's width, e.lunge: s from the blink to the bite · e.inscribed: { window, again, back } s a second press is open, the share of the first thrust it strikes for, and the degrees his aim may stand off the first thrust's line for the second to go back through the hero the first ran through (0: never) · e.follow: { window, turn } for window s after a thrust runs a hero through (the rings' own hold), while his aim stands within turn degrees of the thrust's line, a basic attack whose cone holds no enemy unit of any kind is cut toward that hero if he stands in the swing's reach, and his body holds that turn to the swing's end (window 0: never) ·
# r: the Duelist's Circle. wall: the dome is a ring wall (scripts/lib/ring-wall.js: no hero walks, dashes or is thrown across it; a
#   cleanse, a relic's freedom or a dash whose row says `unstoppable` passes) · relight: s between two relights of his rings while he
#   stands inside · windup: s from the press to the dome (control in it stops the ultimate) · damage, effects: the shatter when it ends.
veyran:
  name: Veyran
  title: The Sigilblade
  story: "A duelist of the archon courts who found spells too slow and carved them into steel. Every sigil on his black greatsword is a spell he beat out of its owner. He is here for the three he lacks."
  combo: [rmb, e, q, r] # the descent onto a hero (its slam lights a ring), then on three rings the thrust and its second press, or the cleave on who stands in his reach; the Ward when the duel is his
  class: fighter
  role: bruiser
  ult: { cost: 1100 }
  weapon: a black greatsword etched with white-gold sigils
  resource: mana
  color: [2.3, 1.85, 1.05] # white-gold: his sigils (a blow's number, the stock shapes in his colour). The violet-black between them is his effects' own (scripts/fx/lib/veyran-fx.js)
  stats: { hp: 650, mana: 300, ad: 66, ap: 0, armor: 36, mr: 32, moveSpeed: 6.8, attackSpeed: 0.625, hpRegen: 7.5, manaRegen: 7 }
  growth: { hp: 104, mana: 40, ad: 4.2, armor: 4.4, mr: 1.6, attackSpeed: 0.028, hpRegen: 0.6, manaRegen: 0.5 }
  passive: { name: Inscription, rings: 3, hold: 8, waste: true, spell: 1, amp: 1, short: "Three basic hits light his rings. On three, his next ability is INSCRIBED: twice as hard, with a second effect. Cast early and the rings are lost.", desc: "Three sigil rings ride his blade. A basic attack that lands lights one, and so does an ability that strikes; they stay lit for 8 s after his last hit. With all three lit his next ability is INSCRIBED: it spends the rings, strikes twice as hard and gains a second effect. An ability cast on one or two rings takes them and gains nothing. The rhythm: a spell, two swings, a spell." } # waste: a cast on fewer than `rings` takes them · spell: rings a spell that strikes lights, once a cast · amp: how much harder every blow of an inscribed spell strikes (1: twice as hard; was 0.7, izkimar 2026-10-05; lib/veyran.js) · short: his passive's line in the hero pick (lib/ui-draft.js)
  lmb: { name: Graven Edge, type: melee, range: 4.4, angle: 150, combo: 3, hitFrame: 0.4, overhead: 1, damage: { ad: 1 }, clip: attack, desc: "Heavy two-handed cuts: two sweeps, then an overhead blow for 40% more. Each swing that lands lights one sigil ring." }
  rmb: { name: Sigil Descent, type: dash, groundAim: true, longAim: true, range: 9.1, radius: 3, leap: { base: 0.42, per: 0.03 }, mobility: both, heavy: true, cc: { kind: slow, away: true }, botTell: { shape: circle, kind: windup, tag: veyran-scar, at: 0.6 }, damage: { base: [60, 90, 120, 150, 180], ad: 0.42, type: magic }, inscribed: { duration: 2, radius: 3.5, slow: 0.4, grip: 1.5 }, cooldown: [14, 13, 12, 11, 10], cost: 45, clip: rmb, short: "Leap up to 9 m and slam the ground. Inscribed: the slam and its scar slow.", desc: "Hold to aim a spot up to 9 m away, release to leap there and drive the blade into the ground: everything within 3 m is struck. INSCRIBED: it strikes twice as hard and slows everyone it strikes by 40% for 1.5 s, and the scar stays for 2 s and slows enemies that stand in it by 40%. The spell for an enemy who walks away." }
  q: { name: Sigil Cleave, type: cone, heavy: true, range: 6.5, angle: 110, windup: 0.3, when: { field: vyRings, "on": self, min: 3 }, botTell: { shape: cone, kind: windup, tag: veyran-cleave }, damage: { base: [45, 70, 95, 120, 145], ad: 0.47 }, inscribed: { linger: 1.2, inner: 2, slow: 0.2, damage: { base: [45, 75, 105, 135, 165], ad: 0.38, type: magic } }, cooldown: [8, 7.5, 7, 6.5, 6], cost: 30, clip: q, short: "A heavy 6.5 m sweep. Inscribed: its crescent burns the ground, then bursts.", desc: "A heavy two-handed sweep writes a crescent of script through the 110° in front of him, 6.5 m out. INSCRIBED: it strikes twice as hard, and the crescent past his feet (2 m to 6.5 m) stays as a burning band for 1.2 s: enemies on it are slowed 20%, and then it bursts: magic damage to every enemy still standing on it. An enemy in his sword's reach stands on it. The spell for an enemy who stands and fights." }
  e: { name: Blink Thrust, type: dash, range: 6, reach: 2.5, width: 2.2, lunge: 0.12, mobility: both, when: { field: vyRings, "on": self, min: 3 }, damage: { base: [50, 75, 100, 125, 150], ad: 0.55 }, inscribed: { window: 3, again: 0.7, back: 60 }, follow: { window: 8, turn: 60 }, cooldown: [11, 10.5, 10, 9.5, 9], cost: 40, clip: e, short: "Blink 6 m, tip first, through every enemy on the line. Inscribed: thrust twice.", desc: "He comes apart into script and reappears up to 6 m ahead in a lunge: every enemy on the line he crossed, and within the blade's reach past it, is struck. He never blinks through a wall. After it runs a hero through, your basic attacks with no hero before them turn back on that hero (for 8 s, until you turn your look). INSCRIBED: it strikes twice as hard, and for 3 s E thrusts a second time, at no cost, for 70% of the first: back through the hero he ran through, or where you look once you have turned." }
  r: { name: Rune Ward, type: area, at: self, heavy: true, radius: 8, windup: 0.4, duration: 5, relight: 1, wall: { heroes: true }, ult: { use: area, n: 1, r: 6, own: 0.4, most: 2 }, cc: { kind: knockback, away: true }, botTell: { shape: circle, kind: windup, tag: veyran-ward }, damage: { base: [150, 250, 350], ad: 0.6, type: magic }, effects: [{ kind: knockback, distance: 4 }], cost: 100, clip: r, short: "A dome 8 m around you, 5 s. No hero walks in or out. Inside, your rings relight.", desc: "The Duelist's Circle. He drives the blade into the ground and a dome of script rises 8 m around it for 5 s. No hero can walk, dash or be thrown across its wall, in or out, him and his allies too; shots and spells pass. While he stands inside, his rings relight every second: every ability is INSCRIBED. When it ends the dome shatters: magic damage to every enemy inside, thrown 4 m outward. The dome blinks three times in its last second. A cleanse, a relic's freedom or an unstoppable dash crosses the wall. If he dies, it falls with no blast." }
