  passive: { name: Rime, short: "Her abilities Chill (a slow). An ability on a Chilled enemy deals 60% more and spends the Chill.", desc: "Every Isra ability Chills what it hits for 4 s (25% slow). An ability that hits an enemy already Chilled deals 60% more damage and spends the Chill. Her spear's fangs Chill for 2 s at 15%." }
  lmb: { name: Rime Fang, type: projectile, range: 17, speed: 38, width: 0.6, damage: { ad: 1, type: magic }, clip: attack, desc: "A fang of ice from the spear's head; Chills for 2 s." }
  q: { name: Serpent Lance, short: "A serpent of living ice strikes down the line at the first enemy. It Chills.", type: skillshot, botTell: { at: 0 }, castTime: 0.2, range: 26, speed: 42, width: 0.9, pierce: 0, damage: { base: [80, 110, 140, 170, 200], ap: 0.6, type: magic }, cooldown: [5, 4.75, 4.5, 4.25, 4], cost: [45, 50, 55, 60, 65], clip: q, desc: "A serpent of living ice strikes down the line at the first enemy. Chills. On an enemy already Chilled it deals 60% more and spends the Chill (Rime)." }
  rmb: { name: Fangfall, short: "Aim a circle: three volleys of black fangs fall on it, slowing and Chilling.", type: area, at: aim, longAim: true, botTell: { shape: circle, piece: blizzard, stay: 1.6 }, range: 26, radius: 5.5, delay: 0.9, waves: 3, waveGap: 0.8, damage: { base: [45, 65, 85, 105, 125], ap: 0.3, type: magic }, effects: [{ kind: slow, amount: 0.4, duration: 1.5 }], cooldown: [16, 15.25, 14.5, 13.75, 13], cost: [80, 85, 90, 95, 100], clip: rmb, desc: "Hold to aim a 5.5 m circle up to 26 m. Black ice gathers over it for 0.9 s, then three volleys of fangs slam down 0.8 s apart, each damaging, slowing 40% and Chilling." }
  e: { name: Rimebreath, short: "A fan of freezing air ahead. It Chills; an enemy already Chilled is frozen in place.", type: cone, botTell: { shape: cone, piece: cone }, range: 11, angle: 50, windup: 0.25, damage: { base: [110, 140, 170, 200, 230], ap: 0.7, type: magic }, chilledRoot: 0.75, cooldown: [11, 10.5, 10, 9.5, 9], cost: [70, 75, 80, 85, 90], clip: e, desc: "Her serpents breathe a fan of freezing air 11 m ahead. Chills; an enemy that was already Chilled is frozen in place (rooted) for 0.75 s." }
  # The Sentence (the owners, 2026-10-03: "it roots, but it doesn't really do any damage", "it should be a burst ability"). One blow, where she
  # aims: `damage` is the HEART's (who stands within `heart` m of the centre), the rest of the circle takes `rim` of it, everyone struck is
  # held by `effects`. Nothing stands on and nothing breaks later. The amounts, against the other mages' rows (scripts/test/heroes1.test.mjs
  # holds each line): the rim is an area ultimate's blow (Skyburst's), the heart Masterpiece's, and a Chilled hero in the heart takes
  # Sunfall's 350/500/650 and never more. Rime's share is a second magic blow the struck hero resists again (lib/jaina.js): "60% more" is
  # 1 + 0.6 x 100 / (100 + magic resist), 1.47 at most at rank 1 and 1.43 at rank 3 (the least magic resist a hero has at levels 1, 6, 11),
  # so 240/345/455 Chilled is 352/499/649 on the softest hero and less on every other.
  # heart 4 m: a Chilled hero (25% slow) walks 4.5 m in the 0.9 s before the blow and a body is in the heart when any of it is (its own
  # 0.6 m): the hero she Chilled and aimed at is in the heart when it lands. An unchilled one who keeps walking takes the rim.
  # scripts/jaina-piece.js mode "sentence"; lib/hero-rules.js sentenceOn.
  # tellCore: the held aim's telegraph draws the heart's circle inside the landing disc (lib/tells/area.js)
  # THE ROOT IS LONG AT THE HEART AND SHORT ON THE RIM (the owners, 2026-10-03: "do you like a longer root on people in the center and a much
  # shorter duration on people that aren't? That'd probably be cool."). `effects` is the HEART's root, `rimRoot` the rest of the circle's
  # (scripts/jaina-piece.js lays each). 1.5 s at the heart: the roster's area-ultimate root (Masterpiece's), and longer than Fangfall's 0.9 s
  # gather, so a volley cast on a hero rooted at the heart lands on him. 0.5 s on the rim: a stumble, shorter than that gather (he walks out
  # of a Fangfall), long enough for one Serpent Lance. Was 1.25 s on everyone: the heart gained 0.25 s, the rim paid 0.75 s for it.
  # A tap (the key up within 180 ms) with an enemy hero on the crosshair's line, nearer than the tap's own spot, lands ON that hero
  # (lib/jaina.js TAP): a tap landed about 10 m out whatever stood nearer, so a hero who had dived on her took the rim.
  r: { name: The Sentence, short: "Her serpents strike a circle: its heart roots 1.5 s, its rim 0.5 s. Bursts the Chilled.", type: area, at: aim, longAim: true, heavy: true, botTell: { shape: circle, piece: sentence }, range: 28, radius: 7.5, heart: 4, tellCore: 4, rim: 0.8, delay: 0.9, damage: { base: [240, 345, 455], ap: 0.9, type: magic }, effects: [{ kind: root, duration: 1.5 }], rimRoot: 0.5, cost: 100, clip: r, desc: "Hold to aim a 7.5 m circle up to 28 m: her serpents rise round its rim. 0.9 s later they strike its heart. Enemies within 4 m of the centre take the full blow and are rooted 1.5 s; the rest of the circle takes 80% of it and is rooted 0.5 s. A Chilled enemy takes 60% more (Rime): Chill with the lance, then pass the sentence. A quick tap lands it on the nearest enemy hero ahead of her. The sentence is passed once: nothing lingers." }
invoker:
  name: Auron
  title: Keeper of the Three Signs
  story: "Auron keeps the three Signs of the first oath, Frost, Storm and Stone, and reads in their turning what the mesa will do next. He has been right for so long that the houses stopped asking whether he also makes it happen."
  owner: module # lib/bot-invoker.js (it calls three Signs again after each cast: a cast spends them)
  class: mage
  role: support
  ult: { none: true } # Foretell is his whole kit, not one spend: no bar (the Signs a cast spends are no bar either: each spell keeps its own cooldown). It is innate (his r row carries invoke, so it casts from level 1) and its tier is R's rank, 1 / 2 / 3 at the levels lib/ranks.js gives R (lib/invoker-core.js invokeTier). The Signs are q Frost (id quas), e Storm (id wex), rmb Stone (id exort), each at the rank its slot has
  weapon: none   # he casts bare-handed (unarmed casting clips); the Signs he holds ride in his hands' light: the last called in his right hand, the two before it at his left (lib/invoker.js)
  resource: mana
  color: [2.6, 1.6, 0.6]
  stats: { hp: 560, mana: 480, ad: 52, ap: 0, armor: 19, mr: 30, moveSpeed: 6.6, attackSpeed: 0.65, hpRegen: 5.5, manaRegen: 8 }
  growth: { hp: 92, mana: 30, ad: 3, armor: 4.2, mr: 1.3, attackSpeed: 0.02, hpRegen: 0.55, manaRegen: 0.85 }
  orbs: # each Sign he holds grants its bonus × its rank; three stands, a fourth call drops the oldest (s.orbs, oldest first). The ids quas / wex / exort are Frost / Storm / Stone on screen
    quas:  { color: [0.86, 0.95, 1.05], hpRegenPerRank: 0.4 }                     # hp/s per Sign per Frost rank (3 Signs at rank 5 = 6 hp/s)
    wex:   { color: [1.15, 0.85, 0.35], moveSpeedPerRank: 0.008, attackSpeedPerRank: 0.02 } # 3 × rank 5 = +12% move, +30% attack speed
    exort: { color: [0.9, 0.42, 0.05], adPerRank: 2.5 }                          # 3 × rank 5 = +37.5 AD
  invoke: { lockout: [0.9, 0.7, 0.5], spellHaste: [0, 10, 20], minOrbs: 3, spend: false, finish: { quas: { slow: 0.2, secs: 1 }, wex: { reach: 0.15 }, exort: { damage: 0.1 } } } # by invoke tier 1..3: the gap between two casts (s.cd.r: his R has no bar, lib/charge.js); haste on every spell cooldown. spend: a cast uses up the three Signs (their gifts end until three more are called); a number spends that many, the last called first. finish: what the LAST Sign called adds to the spell: Frost a slow on what it hits, Storm reach and speed, Stone damage
  spells: # key = Sign letters sorted q<w<e (q Frost, w Storm, e Stone); a number list indexes the named orb's rank 1..5 (orb: says which when a field has no own orb)
    qqq: { name: Brittle, orb: quas, icon: cold-snap, type: targeted, targeted: true, range: 20, lockSlack: 2.5, stun: 0.4, duration: [2.5, 3, 3.5, 4, 4.5], damage: { base: [30, 50, 70, 90, 110], ap: 0.3, type: magic }, proc: { damage: { base: [15, 25, 35, 45, 55], ap: 0.1, type: magic }, freeze: 0.25, every: [1.0, 0.95, 0.9, 0.85, 0.8], minHit: 10 }, cooldown: 12.5, cost: 100, clip: cast1, desc: "Freezes the enemy under the reticle (20 m): 0.4 s stun, then for 2.5–4.5 s (Frost) any hit of 10+ damage re-freezes them 0.25 s for a little extra damage, at most once per 1.0–0.8 s." }
    qqw: { name: Whiteout, orb: quas, icon: ghost-walk, type: self, invis: 10, fadeIn: 0.35, revealRadius: 4, footprintEvery: 1.0, selfSpeed: { orb: wex, amount: [-0.15, -0.05, 0.05, 0.12, 0.2] }, aura: { radius: 6, every: 0.5, slow: [0.2, 0.25, 0.3, 0.35, 0.4] }, cooldown: 22.5, cost: 150, clip: cast2, desc: "Fades from sight for 10 s — casting or attacking ends it, calling a Sign does not; enemies within 4 m see through it. Enemies within 6 m are chilled (Frost slow). Storm decides whether he creeps or strides." }
