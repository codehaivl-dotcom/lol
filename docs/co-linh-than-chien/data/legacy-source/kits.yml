jaina:
  name: Isra
  title: High Priestess of the Rime Court
  story: "Isra took the high seat of the Rime Court, the ice halls under the north face, by freezing the three who sat above her. She passes a sentence once; her serpents of living ice carry it out."
  owner: module # lib/bot-jaina.js
  class: mage
  role: mage
  ult: { cost: 1100 } # 2026-10-05 the owners: her Sentence comes rarer (was 800)
  weapon: serpent-lash ice spear (two-handed; it casts with the staff clips)
  resource: mana
  clear: false # lib/bot-jaina.js casts Fangfall and Rimebreath at a wave by its own rule
  color: [0.75, 1.9, 2.9]
  rider: scripts/isra-serpents.js # her serpents FOLLOW her: the worn part's seat lags her turn and trails her run, and is home on her line while she casts (the owners, 2026-10-03; scripts/champion.js stands a hero's rider)
  stats: { hp: 540, mana: 500, ad: 50, ap: 0, armor: 18, mr: 30, moveSpeed: 6.6, attackSpeed: 0.65, hpRegen: 5.5, manaRegen: 8 }
