  rider: scripts/zephira-storm.js # her body's own storm, for as long as the body is hers (scripts/champion.js spawns a hero's rider): the thunderhead in her staff's ring, the cloud shawl, the sparks in her hair
  storm: # where each piece of it stands on her. bone = a joint of her rig; at = metres from that joint in the bone's OWN frame (the rig's rest frames: +Y runs down a limb to its child; on a hand +Z is her front in the T-pose, the axis a staff lies along in the fist, and +X is up; on the spine and the head +X is her left, +Y up, +Z her front); no bone = her body's own frame (metres over her feet, +X her right, +Z behind her); bare = the row for the placeholder body, which holds no staff and hangs its arms at its hips. The rows are fitted to her v4-10 body at its scale of 1.056 (the model lane's install/facts.txt gives every height): a row with a bone follows a new body by itself, a row in her body's own frame does not
    head: { bone: LeftHand, at: [0.031, 0.065, 0.776], lead: 0.1, bare: { at: [0, 1.9, 0.08], size: 0.26 }, size: 0.32 } # the thunderhead: the middle of her staff's ring (the model lane's own measure: 0.84 m up the staff from the wrist; the ring's inside is 0.41 m clear). THE STAFF IS IN HER LEFT HAND (the lead's ruling of 2026-10-03): the game's eye looks through a point 0.7 m to her RIGHT and 2.2 m over her feet (scripts/lib/data/camera.yml shoulder, eyeHeight) and every target of her aim stands on the screen's middle column from there up, so a ring in the right hand stood on the crosshair; in the left it stands about 0.7 m from that line at rest, in the glide forward and in every cast (seen live with targets 4, 9 and 14 m ahead). In the glide to her right her body turns to that side and carries the staff ahead of her, onto the aim column: there the cloud still thins for the player's own eye (storm.head in scripts/fx/lib/heroes/zephira.js). lead = the share of her body's step of a tick that the ball is placed ahead of its joint, so that it stays IN the ring on the move (measured from the game's own line of sight in the glide to each side, where the ring is edge-on, at leads of 0, 0.25, 0.5 and 1: at 0 the ball is a few centimetres behind the ring's middle, at 0.25 as far ahead, at 0.5 ahead by a quarter of itself, at 1 out of the ring: lanes/zephira/f9/_p-lead-right.jpg, _p-lead-left.jpg. It was 0.5, fitted on an earlier day to a lag that is no longer there). If the ring gets a socket of its own this row is { socket: <its name> } with at [0, 0, 0]. bare (no bone: the body's own frame): the placeholder holds no staff, so its storm sits ON HER HEAD, on her own axis: a smaller ball, its middle 1.9 m over her feet (the placeholder's crown is 1.7 m up), its top under her bar and her name
    armL: { bone: LeftForeArm, at: [0, 0.124, 0], bare: { bone: LeftArm, at: [0, 0.14, 0] } } # the shawl round an arm: mid-forearm, over the cloth cuff. bare: the upper arm (a hanging forearm is at the girdle, where no cloud of hers may be)
    armR: { bone: RightForeArm, at: [0, 0.124, 0], bare: { bone: RightArm, at: [0, 0.14, 0] } }
    back: { at: [0, 1.8, 0.5], bare: { at: [0, 1.42, 0.3] } } # the shawl's coil behind her shoulders: no bone, the body's own frame. Her model floats: its shoulder line is 1.80 m up, and her mane's back stands 0.26 m behind that line, 0.58 m wide: the coil rides 0.5 m behind her, clear of the mane and over its top half (at 1.66 m and 0.45 m, the row of the body before, its billows lay on the lower half of the mane). bare: the placeholder's shoulders
    hair: { bone: Head, at: [0, 0.093, -0.059], bare: { bone: Head, at: [0, 0.16, 0] } } # the sparks: the top-back of the hair mass, where the camera behind her sees it. bare: over the placeholder's bald crown
    trailL: { at: [-0.3, 1.52, 0.1], bare: { at: [-0.26, 1.34, 0.08] } } # what her shawl leaves behind her ON THE MOVE (the rider puts these two on while her BODY moves and takes them off when it stands): no bone, the body's own frame (+X her right, +Z behind her), beside her forearms' cuffs at their height in the glide (the forearms' middles ride 1.49 to 1.65 m up in the glide of her v4-10 body; at 1.4 m the ropes left her at her waist). No clip swings a point of this frame, so a strike standing leaves nothing in the air and a strike on the move leaves the same two ropes as a glide (on a forearm bone every swing of the arm read as a run: dark balls over her head at each basic attack, seen live)
    trailR: { at: [0.3, 1.52, 0.1], bare: { at: [0.26, 1.34, 0.08] } }
  stats: { hp: 570, mana: 360, ad: 46, ap: 0, armor: 28, mr: 28, moveSpeed: 6.5, attackSpeed: 0.625, hpRegen: 5.5, manaRegen: 11.5 }
  growth: { hp: 90, mana: 50, ad: 2.5, armor: 4.5, mr: 1.3, attackSpeed: 0.03, hpRegen: 0.55, manaRegen: 0.4 }
  mend: { hero: 0.5, other: 0.15, self: 0.5 } # Storm's Answer (scripts/lib/zephira.js): the share of her damage that heals an ally wearing her shell (to a hero, to anything else), and self: the share of THAT which heals Zephira while her own shell stands on her (the owners' review of 2026-10-03: "she should absolutely heal herself, but it can be for a reduced amount [...] cut in half")
  passive: { name: "Storm's Answer", short: "While her storm shell stands on a hero, the damage Zephira deals heals that hero: an ally in full, herself for half.", desc: "While an ally wears Zephira's storm shell, the damage she deals heals that ally: 50% of her damage to heroes, 15% of her damage to anything else. While her own shell stands on her it heals Zephira too, for half as much. Her basic attacks count." }
  lmb: { name: Fork Bolt, type: projectile, range: 16, speed: 30, width: 0.6, damage: { ad: 1 }, clip: attack, desc: "A fork of lightning from the thunderhead in her staff." }
  rmb: { name: Squall Rune, type: skillshot, castTime: 0.2, range: 17, speed: 36, width: 1.1, pierce: 0, cc: { kind: slow, away: true }, damage: { base: [70, 100, 130, 160, 190], ap: 0.5, type: magic }, effects: [{ kind: slow, amount: 0.3, duration: 2 }], self: [{ kind: speed, amount: 0.15, duration: 3 }], cooldown: 8, cost: [50, 60, 70, 80, 90], clip: cast, desc: "Hurls a rune stone wrapped in storm at the first enemy: it slows them, and the squall quickens her." }
